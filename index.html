    }

      from { transform: translateY(24px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up {
      animation: slideUp 0.22s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-fade-in {
      animation: fadeIn 0.2s ease-out forwards;

    // Resolve effective delivery mode & assets for a product (inheriting from its Category)
    function getEffectiveDeliveryConfig(prod) {
      const cat = state.categories.find(c => c.id === prod.categoryId);
      const mode = (!prod.deliveryMode || prod.deliveryMode === 'inherit')
        ? (cat?.deliveryMode || 'auto')
        : prod.deliveryMode;
      const sheetUrl = (prod.sheetUrl && prod.sheetUrl.trim())
        ? prod.sheetUrl.trim()
        : (cat?.sheetUrl ? cat.sheetUrl.trim() : '');
      const directLink = (prod.directLink && prod.directLink.trim())
        ? prod.directLink.trim()
        : (cat?.directLink ? cat.directLink.trim() : '');
      const fileUrl = prod.fileUrl || cat?.fileUrl || '';
      const fileName = prod.fileUrl ? (prod.fileName || 'Delivery_File') : (cat?.fileName || 'Delivery_File');
      return { mode, sheetUrl, directLink, fileUrl, fileName };
    }

    // Handle Gallery Image Selection via ObjectURL (Instant, lightweight, no base64 bloat)
    function handleGalleryImagePick(inputEl, targetKey, previewElId) {
      const file = inputEl.files && inputEl.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        showToast('অনুগ্রহ করে শুধুমাত্র ছবি (JPG/PNG/WebP) সিলেক্ট করুন।', 'error');
        return;
      }
      const blobUrl = URL.createObjectURL(file);
      if (targetKey === 'storeLogo') {
        state.settings.storeLogoUrl = blobUrl;
        showToast('মিনি অ্যাপের নতুন লোগো গ্যালারি থেকে যুক্ত হয়েছে!', 'success');
        renderApp();
        return;
      }
      tempUploads[targetKey] = blobUrl;
      const previewEl = document.getElementById(previewElId);
      if (previewEl) {
        previewEl.innerHTML = `<img src="${blobUrl}" alt="Preview" class="w-full h-full object-cover" />`;

    // Calculate live Deposit & Purchase stats for any user
    function getUserStats(userId) {
      const userDeposits = state.deposits.filter(d => d.userId === userId);
      const userOrders = state.orders.filter(o => o.userId === userId);
      const totalDeposited = userDeposits
        .filter(d => d.status === 'approved')
        .reduce((sum, d) => sum + d.amountBdt, 0);
      const totalSpent = userOrders.reduce((sum, o) => sum + o.totalPrice, 0);
      const totalItemsBought = userOrders.reduce((sum, o) => sum + o.qty, 0);
      return {
        depositsCount: userDeposits.length,
        ordersCount: userOrders.length,
        totalDeposited,
        totalSpent,
        totalItemsBought,
        userDeposits,
        userOrders
      };
    }

    // Escape HTML to safely render user/admin text
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Format BDT currency cleanly
    function formatBDT(amount) {
      const num = Number(amount) || 0;
      return '৳ ' + num.toLocaleString('en-US', { minimumFractionDigits: num % 1 === 0 ? 0 : 2, maximumFractionDigits: 2 });
    }

    // Generate short readable ID
    function generateId(prefix) {
      return prefix + '_' + Math.random().toString(36).substring(2, 8).toUpperCase();
    }

    // Format current time
    function getNowTime() {
      const now = new Date();
      return now.toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' }) + ', ' +
             now.toLocaleDateString('bn-BD', { day: 'numeric', month: 'short' });
    }

    // Reliable Clipboard Copy inside iFrames using document.execCommand('copy')
    function copyText(text, label = 'কপি করা হয়েছে!') {
      try {
        const tempInput = document.createElement('textarea');
        tempInput.value = text;
        tempInput.style.position = 'fixed';
        tempInput.style.opacity = '0';
        document.body.appendChild(tempInput);
        tempInput.focus();
        tempInput.select();
        document.execCommand('copy');
        document.body.removeChild(tempInput);
        showToast(label, 'success');
      } catch (err) {
        showToast('কপি করতে সমস্যা হয়েছে, ম্যানুয়ালি কপি করুন।', 'error');
      }
    }

    // Custom Toast Notification (Never uses alert())
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const styles = {
        success: 'bg-emerald-600 text-white shadow-emerald-600/30',
        error: 'bg-rose-600 text-white shadow-rose-600/30',
        info: 'bg-slate-800 text-white shadow-slate-900/30',
        warning: 'bg-amber-500 text-amber-950 shadow-amber-500/30'
      };
      const icons = {
        success: '✓',
        error: '✕',
        info: 'ℹ',
        warning: '!'
      };
      toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-2xl shadow-lg text-sm font-medium animate-slide-up ${styles[type] || styles.info}`;
      toast.innerHTML = `
        <span class="w-5 h-5 rounded-full bg-white/20 flex items-center justify-center text-xs font-bold shrink-0">${icons[type] || 'ℹ'}</span>
        <span class="flex-1 leading-snug">${escapeHtml(message)}</span>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-8px)';
        toast.style.transition = 'all 0.25s ease';
        setTimeout(() => toast.remove(), 260);
      }, 2800);
    }

            : 'bg-white text-slate-600 border-slate-200 hover:border-indigo-300'
        }">📂 সব ক্যাটাগরি (${state.categories.length})</button>`,
        `<button onclick="setShopBrowseMode('all')" class="shrink-0 px-3.5 py-2 rounded-2xl text-xs sm:text-sm font-semibold transition-all border ${
          !showCategoryGrid && state.selectedCategoryId === 'all'
            ? 'bg-indigo-600 text-white border-indigo-600 shadow-md shadow-indigo-600/25'
            : 'bg-white text-slate-600 border-slate-200 hover:border-indigo-300'
        }">🔥 সব প্রোডাক্ট (${state.products.length})</button>`,
        ...state.categories.map(cat => {
          const count = state.products.filter(p => p.categoryId === cat.id).length;
          const active = state.selectedCategoryId === cat.id;
          return `
            <button onclick="selectCategory('${cat.id}')" class="shrink-0 px-3.5 py-2 rounded-2xl text-xs sm:text-sm font-semibold transition-all border flex items-center gap-1.5 ${
              active
                ? 'bg-indigo-600 text-white border-indigo-600 shadow-md shadow-indigo-600/25'
                : 'bg-white text-slate-700 border-slate-200 hover:border-indigo-300'
            }">
              ${cat.logoUrl
                ? `<img src="${escapeHtml(cat.logoUrl)}" class="w-4 h-4 rounded-full object-cover" />`
                : `<span>${escapeHtml(cat.icon)}</span>`}
              <span>${escapeHtml(cat.name)}</span>
              <span class="text-xs opacity-75">(${count})</span>
            </button>
          `;
        })
      ].join('');

      // Build All-Categories Visual Folder Grid
      const categoryGridHtml = state.categories.length === 0
        ? `
          <div class="bg-white rounded-3xl border border-slate-200/80 p-8 text-center text-xs text-slate-500">
            এখনো কোনো ক্যাটাগরি যোগ করা হয়নি।
          </div>
        `
        : `
          <div class="grid grid-cols-2 gap-3">
            ${state.categories.map(cat => {
              const catProducts = state.products.filter(p => p.categoryId === cat.id);
              const totalStock = catProducts.reduce((s, p) => s + p.stock, 0);
              const minPrice = catProducts.length > 0 ? Math.min(...catProducts.map(p => p.price)) : 0;
              return `
                <button onclick="selectCategory('${cat.id}')" class="group bg-white rounded-3xl border border-slate-200/90 hover:border-indigo-400 hover:shadow-md active:scale-[0.98] p-4 text-left transition-all flex flex-col justify-between gap-3 shadow-sm">
                  <div class="flex items-start justify-between gap-2">
                    ${renderCategoryVisual(cat, 'w-12 h-12')}
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-lg ${totalStock > 0 ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-600'}">
                      স্টক: ${totalStock}
                    </span>
                  </div>
                  <div>
                    <h3 class="font-bold text-slate-900 text-base group-hover:text-indigo-700 transition-colors truncate">${escapeHtml(cat.name)}</h3>
                    <p class="text-xs text-slate-500 mt-0.5">${catProducts.length}টি আইটেম ${minPrice > 0 ? `• ${formatBDT(minPrice)} থেকে` : ''}</p>
                    <div class="mt-2 flex items-center justify-between gap-1">
                      ${renderDeliveryBadge(cat.deliveryMode || 'auto')}
                      <span class="text-xs font-bold text-indigo-600 group-hover:translate-x-0.5 transition-transform">দেখুন →</span>
                    </div>
                  </div>
                </button>
              `;
            }).join('')}
          </div>
        `;

      // Build Product Cards (Shown inside a chosen Category, Search, or "All Products" mode)
      const productsHtml = filteredProducts.length === 0
        ? `
          <div class="bg-white rounded-3xl border border-slate-200/80 p-8 text-center">
            <div class="text-4xl mb-2">📦</div>
            <p class="font-semibold text-slate-700">এই ক্যাটাগরিতে কোনো প্রোডাক্ট পাওয়া যায়নি</p>
            <p class="text-xs text-slate-500 mt-1">অন্য ক্যাটাগরি দেখুন অথবা এডমিন প্যানেল থেকে প্রোডাক্ট যোগ করুন।</p>
            ${activeCat ? `<button onclick="setShopBrowseMode('categories')" class="mt-3 px-4 py-2 rounded-xl bg-indigo-50 text-indigo-700 text-xs font-bold">← সব ক্যাটাগরিতে ফিরুন</button>` : ''}
          </div>
        `
        : `
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
            ${filteredProducts.map(prod => {
              const cat = state.categories.find(c => c.id === prod.categoryId);
              const { mode } = getEffectiveDeliveryConfig(prod);
              const inStock = prod.stock > 0;
              return `
                <div class="bg-white rounded-3xl border border-slate-200/90 p-4 shadow-sm hover:shadow-md hover:border-indigo-200 transition-all flex flex-col justify-between">
                  <div>
                    <!-- Top Row: Category & Stock Status -->
                    <div class="flex items-center justify-between gap-2 mb-2">
                      <span class="inline-flex items-center gap-1.5 text-xs font-semibold px-2.5 py-1 rounded-xl bg-slate-100 text-slate-700">
                        ${cat && cat.logoUrl
                          ? `<img src="${escapeHtml(cat.logoUrl)}" class="w-4 h-4 rounded-full object-cover" />`
                          : `<span>${cat ? escapeHtml(cat.icon) : '🏷️'}</span>`}
                        <span>${cat ? escapeHtml(cat.name) : 'সাধারণ'}</span>
                      </span>
                      <span class="inline-flex items-center gap-1 text-xs font-bold px-2.5 py-1 rounded-xl ${
                        inStock ? 'bg-emerald-50 text-emerald-700 border border-emerald-200/70' : 'bg-rose-50 text-rose-600 border border-rose-200/70'
                      }">
                        <span class="w-1.5 h-1.5 rounded-full ${inStock ? 'bg-emerald-500' : 'bg-rose-500'}"></span>
                        ${inStock ? `স্টক: ${prod.stock}টি` : 'স্টক আউট'}
                      </span>
                    </div>

                    <!-- Delivery Mode Badge -->
                    <div class="mb-2">
                      ${renderDeliveryBadge(mode)}
                    </div>

                    <!-- Product Title & Desc -->
                    <h3 class="font-bold text-slate-900 text-base leading-snug">${escapeHtml(prod.name)}</h3>
                    <p class="text-xs text-slate-500 mt-1.5 line-clamp-2 leading-relaxed">${escapeHtml(prod.description)}</p>
                  </div>

                  <!-- Bottom Row: Price & Order Button -->
                  <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between gap-2">
                    <div>
                      <span class="block text-[10px] text-slate-400 font-medium">মূল্য (প্রতি পিস)</span>
                      <span class="text-lg font-bold text-indigo-700">${formatBDT(prod.price)}</span>
                    </div>
                    <button onclick="openBuyModal('${prod.id}')" ${!inStock || currentUser.blocked ? 'disabled' : ''} class="px-4 py-2.5 rounded-2xl text-sm font-bold transition-all ${
                      inStock && !currentUser.blocked
                        ? 'bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white shadow-md shadow-indigo-600/20'
                        : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                    }">
                      ${currentUser.blocked ? 'ব্লকড' : (inStock ? 'অর্ডার করুন' : 'শেষ')}
                    </button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;

      return `
        ${currentUser.blocked ? renderBlockedBanner() : ''}

        <!-- Quick Balance Warning if Balance is 0 -->
        ${!currentUser.blocked && currentUser.balance <= 0 ? `
          <div class="bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-200/80 rounded-3xl p-3.5 flex items-center justify-between gap-3">
            <div class="flex items-center gap-2.5">
              <div class="w-9 h-9 rounded-2xl bg-amber-400/20 text-amber-700 flex items-center justify-center text-lg shrink-0">💰</div>
              <div>
                <p class="text-xs font-bold text-amber-950">অর্ডার করতে প্রথমে টাকা ডিপোজিট করুন</p>
                <p class="text-[11px] text-amber-800">সর্বনিম্ন ডিপোজিট ${formatBDT(state.settings.minDeposit)} • ডিপোজিট ব্যালেন্স দিয়ে যেকোনো মাল নিন</p>
              </div>
            </div>
            <button onclick="switchMainTab('deposit')" class="shrink-0 bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold px-3.5 py-2 rounded-xl shadow-sm active:scale-95 transition">
              ডিপোজিট
            </button>
          </div>
        ` : ''}

        <!-- Search Input -->
        <div class="relative">
          <svg class="w-5 h-5 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <input type="text" id="shop-search" value="${escapeHtml(state.searchQuery)}" oninput="handleSearch(this.value)"
            placeholder="প্রোডাক্ট বা ক্যাটাগরি খুঁজুন (যেমন: Hotmail, Gmail, VPN...)"
            class="w-full bg-white border border-slate-200 rounded-2xl pl-11 pr-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 shadow-sm" />
        </div>

        <!-- Horizontal Quick Category Pills -->
        <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
          ${catPillsHtml}
        </div>

        ${showCategoryGrid ? `
          <!-- Category Folder View (Tap any Category to see all products under it) -->
          <div>
            <div class="flex items-center justify-between mb-2.5">
              <div>
                <h2 class="text-sm font-bold text-slate-800">ক্যাটাগরি নির্বাচন করুন</h2>
                <p class="text-[11px] text-slate-500">যেকোনো ক্যাটাগরিতে ক্লিক করে এর ভেতরের সব আইটেম দেখুন</p>
              </div>
              <button onclick="setShopBrowseMode('all')" class="text-xs font-bold text-indigo-600 hover:underline">
                সব প্রোডাক্ট দেখুন →
              </button>
            </div>
            ${categoryGridHtml}
          </div>
        ` : `
          <!-- Active Category Header Bar (When viewing inside a specific Category like Gmail) -->
          ${activeCat ? `
            <div class="bg-white rounded-3xl border border-indigo-200/80 p-3.5 flex items-center justify-between gap-3 shadow-sm">
              <div class="flex items-center gap-3 min-w-0">
                ${renderCategoryVisual(activeCat, 'w-11 h-11')}
                <div class="min-w-0">
                  <h2 class="font-bold text-slate-900 text-base truncate">${escapeHtml(activeCat.name)}</h2>
                  <p class="text-xs text-slate-500">এই ক্যাটাগরির আন্ডারে মোট ${filteredProducts.length}টি আইটেম</p>
                </div>
              </div>
              <button onclick="setShopBrowseMode('categories')" class="shrink-0 px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition">
                ← সব ক্যাটাগরি
              </button>
            </div>
          ` : `
            <div class="flex items-center justify-between mb-1">
              <h2 class="text-sm font-bold text-slate-700">${q ? 'সার্চ ফলাফল' : 'সব ক্যাটাগরির প্রোডাক্ট'}</h2>
              <span class="text-xs text-slate-400">${filteredProducts.length}টি আইটেম</span>
            </div>
          `}
          ${productsHtml}
        `}
      `;
    }

    function selectCategory(catId) {
      state.selectedCategoryId = catId;
      state.shopBrowseMode = 'all';
      renderApp();
    }

    function setShopBrowseMode(mode) {
      state.selectedCategoryId = 'all';
      state.shopBrowseMode = mode;
      renderApp();
    }

    function handleSearch(val) {
      state.searchQuery = val;
      const activeEl = document.activeElement;
      const cursorPos = activeEl ? activeEl.selectionStart : val.length;
      renderApp();
      const input = document.getElementById('shop-search');
      if (input) {
        input.focus();
        input.setSelectionRange(cursorPos, cursorPos);
      }
    }

    // Buy Product Modal
    let currentBuyState = { productId: null, qty: 1 };

    function openBuyModal(productId) {
      const currentUser = getCurrentUser();
      if (currentUser.blocked) {
        showToast('আপনার অ্যাকাউন্ট ব্লক করা হয়েছে! অর্ডার করা সম্ভব নয়।', 'error');
        return;
      }
      const prod = state.products.find(p => p.id === productId);
      if (!prod || prod.stock <= 0) {
        showToast('দুঃখিত, এই প্রোডাক্টটি বর্তমানে স্টকে নেই।', 'error');
        return;
      }
      currentBuyState = { productId, qty: 1 };
      renderBuyModalContent();
    }

    function updateBuyQty(delta) {
      const prod = state.products.find(p => p.id === currentBuyState.productId);
      if (!prod) return;
      const next = currentBuyState.qty + delta;
      if (next >= 1 && next <= prod.stock) {
        currentBuyState.qty = next;
        renderBuyModalContent();
      }
    }

    function renderBuyModalContent() {
      const currentUser = getCurrentUser();
      const prod = state.products.find(p => p.id === currentBuyState.productId);
      if (!prod) return;
      const cat = state.categories.find(c => c.id === prod.categoryId);
      const { mode } = getEffectiveDeliveryConfig(prod);
      const totalCost = prod.price * currentBuyState.qty;
      const hasEnoughBalance = currentUser.balance >= totalCost;
      const shortfall = Math.max(0, totalCost - currentUser.balance);

      openModal(`
        <div class="p-5">
          <div class="flex items-start justify-between gap-3 mb-4">
            <div>
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="text-xs font-semibold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-lg">
                  ${cat ? escapeHtml(cat.icon + ' ' + cat.name) : 'প্রোডাক্ট'}
                </span>
                ${renderDeliveryBadge(mode)}
              </div>
              <h3 class="text-lg font-bold text-slate-900 mt-1.5">${escapeHtml(prod.name)}</h3>
              <p class="text-xs text-slate-500 mt-0.5">${escapeHtml(prod.description)}</p>
            </div>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600 shrink-0">✕</button>
          </div>

          <!-- Quantity Selector -->
          <div class="bg-slate-50 border border-slate-200 rounded-2xl p-3.5 flex items-center justify-between mb-4">
            <div>
              <span class="text-sm font-bold text-slate-700 block">পরিমাণ (Quantity)</span>
              <span class="text-xs text-slate-500">স্টকে আছে: ${prod.stock}টি • প্রতি পিস ${formatBDT(prod.price)}</span>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="updateBuyQty(-1)" class="w-9 h-9 rounded-xl bg-white border border-slate-200 font-bold text-lg text-slate-700 hover:bg-slate-100 active:scale-95">−</button>
              <span class="w-8 text-center font-bold text-base">${currentBuyState.qty}</span>
              <button onclick="updateBuyQty(1)" class="w-9 h-9 rounded-xl bg-white border border-slate-200 font-bold text-lg text-slate-700 hover:bg-slate-100 active:scale-95">+</button>
            </div>
          </div>

          <!-- Price Summary -->
          <div class="space-y-2 text-sm mb-4 bg-white border border-slate-100 rounded-2xl p-3.5 shadow-sm">
            <div class="flex justify-between text-slate-600">
              <span>মোট মূল্য (${currentBuyState.qty} × ${formatBDT(prod.price)})</span>
              <span class="font-bold text-slate-900">${formatBDT(totalCost)}</span>
            </div>
            <div class="flex justify-between text-slate-600">
              <span>আপনার বর্তমান ব্যালেন্স</span>
              <span class="font-bold ${hasEnoughBalance ? 'text-emerald-600' : 'text-rose-600'}">${formatBDT(currentUser.balance)}</span>
            </div>
            <div class="flex justify-between text-slate-600 text-xs pt-1 border-t border-slate-100">
              <span>ডেলিভারি ধরন</span>
              <span class="font-semibold text-slate-800">
                ${mode === 'sheet' ? 'গুগল শিট ফাইল (অটো)' : mode === 'file' ? 'ফাইল ডাউনলোড (অটো)' : mode === 'link' ? 'ডাইরেক্ট লিংক (অটো)' : mode === 'manual' ? 'ম্যানুয়াল (এডমিন ডেলিভারি)' : 'অটোমেটিক ইনস্ট্যান্ট'}
              </span>
            </div>
          </div>

          ${!hasEnoughBalance ? `
            <div class="bg-rose-50 border border-rose-200 rounded-2xl p-3 mb-4 text-xs text-rose-700 flex items-start gap-2">
              <span class="text-base leading-none">⚠️</span>
              <div>
                <p class="font-bold">আপনার ব্যালেন্স পর্যাপ্ত নয়!</p>
                <p class="mt-0.5">এই অর্ডারটি করতে আরও <strong>${formatBDT(shortfall)}</strong> প্রয়োজন। অনুগ্রহ করে প্রথমে টাকা ডিপোজিট করুন।</p>
              </div>
            </div>
            <button onclick="closeModal(); switchMainTab('deposit');" class="w-full py-3.5 rounded-2xl bg-amber-500 hover:bg-amber-600 text-white font-bold text-sm shadow-lg shadow-amber-500/25 active:scale-[0.99] transition">
              টাকা ডিপোজিট করতে যান →
            </button>
          ` : `
            <button onclick="confirmPurchase()" class="w-full py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-lg shadow-indigo-600/25 active:scale-[0.99] transition">
              অর্ডার কনফার্ম করুন (${formatBDT(totalCost)})
            </button>
          `}
        </div>
      `);
    }

    function confirmPurchase() {
      const currentUser = getCurrentUser();
      if (currentUser.blocked) {
        showToast('আপনার অ্যাকাউন্ট ব্লক করা হয়েছে!', 'error');
        return;
      }
      const prod = state.products.find(p => p.id === currentBuyState.productId);
      if (!prod) return;
      const qty = currentBuyState.qty;
      const total = prod.price * qty;

      if (prod.stock < qty) {
        showToast('স্টকে পর্যাপ্ত প্রোডাক্ট নেই!', 'error');
        return;
      }
      if (currentUser.balance < total) {
        showToast('পর্যাপ্ত ব্যালেন্স নেই! অনুগ্রহ করে ডিপোজিট করুন।', 'error');
        return;
      }

      // Deduct balance & stock
      currentUser.balance -= total;
      prod.stock -= qty;

      const { mode, sheetUrl, directLink, fileUrl, fileName } = getEffectiveDeliveryConfig(prod);
      let status = 'pending';
      let deliveredData = '';
      let deliveredSheetUrl = '';
      let deliveredDirectLink = '';
      let deliveredFileUrl = '';
      let deliveredFileName = '';

      if (mode === 'sheet' && sheetUrl) {
        status = 'completed';
        deliveredSheetUrl = sheetUrl;
        deliveredData = `আপনার ${prod.name} (×${qty}) এর গুগল শিট ফাইল লিংক নিচে দেওয়া হলো।`;
      } else if (mode === 'file' && fileUrl) {
        status = 'completed';
        deliveredFileUrl = fileUrl;
        deliveredFileName = fileName || 'Delivery_File';
        deliveredData = `আপনার ${prod.name} (×${qty}) এর ফাইলটি নিচ থেকে ডাউনলোড করুন।`;
      } else if (mode === 'link' && directLink) {
        status = 'completed';
        deliveredDirectLink = directLink;
        deliveredData = `আপনার ${prod.name} (×${qty}) এর অ্যাক্সেস লিংক নিচে দেওয়া হলো।`;
      } else if (mode === 'auto') {
        if (Array.isArray(prod.stockItems) && prod.stockItems.length >= qty) {
          const deliveredLines = prod.stockItems.splice(0, qty);
          status = 'completed';
          deliveredData = deliveredLines.join('\n');
        } else {
          status = 'pending';
        }
      } else {
        status = 'pending';
      }

      const cat = state.categories.find(c => c.id === prod.categoryId);
      const newOrder = {
        id: generateId('ORD'),
        userId: currentUser.id,
        userName: currentUser.name,
        productId: prod.id,
        productName: prod.name,
        categoryName: cat ? cat.name : 'সাধারণ',
        deliveryMode: mode,
        qty: qty,
        unitPrice: prod.price,
        totalPrice: total,
        status: status,
        deliveredData: deliveredData,
        deliveredSheetUrl: deliveredSheetUrl,
        deliveredDirectLink: deliveredDirectLink,
        deliveredFileUrl: deliveredFileUrl,
        deliveredFileName: deliveredFileName,
        createdAt: getNowTime()
      };

      state.orders.unshift(newOrder);
      closeModal();
      showToast(
        status === 'completed'
          ? (deliveredSheetUrl ? 'অর্ডার সফল! গুগল শিট ফাইল ইনস্ট্যান্ট ডেলিভারি হয়েছে।'

                      <p class="text-xs text-slate-600 mt-1 font-mono truncate">TrxID: <strong>${escapeHtml(dep.txId)}</strong></p>

                  </div>
                `;
              }).join('')}
            </div>
          `}

    function selectPaymentMethod(id) {
      state.selectedPaymentId = id;
      renderApp();
    }

    function setQuickDepositAmount(amount) {
      state.depositInputBdt = String(amount);
      renderApp();
    }

    function handleDepositAmountInput(val) {
      state.depositInputBdt = val;
      const bdt = parseFloat(val) || 0;
      const usdEl = document.getElementById('binance-usd-output');
      const formulaRow = document.getElementById('binance-formula-row');
      const formulaText = document.getElementById('binance-formula-text');
      if (usdEl) {
        const usd = state.settings.binanceRate > 0 ? (bdt / state.settings.binanceRate) : 0;
        usdEl.textContent = '$' + usd.toFixed(2);
        if (formulaRow && formulaText) {
          if (bdt > 0) {
            formulaRow.classList.remove('hidden');
            formulaText.innerHTML = `${formatBDT(bdt)} ÷ ${state.settings.binanceRate}৳ = <strong>${usd.toFixed(2)} USDT</strong>`;
          } else {
            formulaRow.classList.add('hidden');
          }
        }
      }
    }

    function copyCurrentBinanceUsd() {
      const bdt = parseFloat(state.depositInputBdt) || 0;
      const usd = state.settings.binanceRate > 0 ? (bdt / state.settings.binanceRate) : 0;
      copyText(usd.toFixed(2), 'ডলার এমাউন্ট কপি হয়েছে!');
    }

    function submitDeposit(e) {
      e.preventDefault();
      const currentUser = getCurrentUser();
      if (currentUser.blocked) {
        showToast('আপনার অ্যাকাউন্ট ব্লক করা হয়েছে! ডিপোজিট করা সম্ভব নয়।', 'error');
        return;
      }
      const amount = parseFloat(document.getElementById('deposit-amount-bdt').value);
      const txId = document.getElementById('deposit-txid').value.trim();
      const method = state.paymentMethods.find(m => m.id === state.selectedPaymentId && m.active);

      if (!method) {
        showToast('অনুগ্রহ করে সচল পেমেন্ট মাধ্যম নির্বাচন করুন।', 'error');
        return;
      }
      if (isNaN(amount) || amount < state.settings.minDeposit) {
        showToast(`সর্বনিম্ন ডিপোজিট ${formatBDT(state.settings.minDeposit)} হতে হবে!`, 'error');
        return;
      }
      if (!txId) {
        showToast('অনুগ্রহ করে ট্রানজেকশন আইডি (TrxID) সঠিকভাবে দিন।', 'error');
        return;
      }

      const usdAmount = method.isBinance && state.settings.binanceRate > 0
        ? (amount / state.settings.binanceRate).toFixed(2)
        : null;

      state.deposits.unshift({
        id: generateId('DEP'),
        userId: currentUser.id,
        userName: currentUser.name,
        methodId: method.id,
        methodName: method.name,
        amountBdt: amount,
        usdAmount: usdAmount,
        txId: txId.toUpperCase(),
        status: 'pending',
        createdAt: getNowTime()
      });

      state.depositInputBdt = '';
      showToast('ডিপোজিট রিকোয়েস্ট জমা হয়েছে! এডমিন অ্যাপ্রুভ করলেই ব্যালেন্সে যোগ হবে।', 'success');
      renderApp();
    }

          </div>
        `;
      }

      const pendingDepositsCount = state.deposits.filter(d => d.status === 'pending').length;
      const pendingOrdersCount = state.orders.filter(o => o.status === 'pending').length;

      // Admin Sub-Navigation Pills
      const adminTabs = [
        { id: 'overview', label: 'ড্যাশবোর্ড' },

        { id: 'deposits', label: `ডিপোজিট${pendingDepositsCount ? ` (${pendingDepositsCount})` : ''}` },
        { id: 'orders', label: `অর্ডার${pendingOrdersCount ? ` (${pendingOrdersCount})` : ''}` },
        { id: 'users', label: `ইউজার (${state.users.length})` },
        { id: 'settings', label: 'পেমেন্ট ও সেটিংস' }
      ];

      let subContent = '';
      if (state.activeAdminTab === 'overview') subContent = renderAdminOverview();
      else if (state.activeAdminTab === 'catalog') subContent = renderAdminCatalog();
      else if (state.activeAdminTab === 'deposits') subContent = renderAdminDeposits();
      else if (state.activeAdminTab === 'orders') subContent = renderAdminOrders();
      else if (state.activeAdminTab === 'users') subContent = renderAdminUsers();
      else if (state.activeAdminTab === 'settings') subContent = renderAdminSettings();

      return `
        <!-- Admin Top Bar -->
        <div class="flex items-center justify-between gap-2">
          <div>
            <h2 class="text-lg font-bold text-slate-900">এডমিন কন্ট্রোল প্যানেল</h2>

            🔒 লক করুন
          </button>
        </div>

        <!-- Sub Tabs -->
        <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
          ${adminTabs.map(t => `
            <button onclick="switchAdminTab('${t.id}')" class="shrink-0 px-3.5 py-2 rounded-2xl text-xs font-bold border transition ${
              state.activeAdminTab === t.id

        <div class="space-y-4">

    function unlockAdmin(e) {
      e.preventDefault();
      const pin = document.getElementById('admin-pin-input').value.trim();
      if (pin === state.settings.adminPin) {
        state.adminUnlocked = true;
        showToast('এডমিন প্যানেলে স্বাগতম!', 'success');
        renderApp();
      } else {
        showToast('ভুল পিন! আবার চেষ্টা করুন।', 'error');
      }
    }

    function lockAdmin() {
      state.adminUnlocked = false;
      showToast('এডমিন প্যানেল লক করা হয়েছে।', 'info');
      renderApp();
    }

    function saveProduct(e, existingId) {
      e.preventDefault();
      const categoryId = document.getElementById('prod-cat').value;
      const name = document.getElementById('prod-name').value.trim();
      const price = parseFloat(document.getElementById('prod-price').value) || 0;
      const stock = parseInt(document.getElementById('prod-stock').value, 10) || 0;
      const deliveryMode = document.getElementById('prod-delivery-mode').value || 'inherit';
      const sheetUrl = document.getElementById('prod-sheet-url').value.trim();
      const directLink = document.getElementById('prod-direct-link').value.trim();
      const fileUrl = tempUploads.prodFileUrl || '';
      const fileName = tempUploads.prodFileName || '';
      const description = document.getElementById('prod-desc').value.trim() || 'মানসম্মত ডিজিটাল প্রোডাক্ট।';
      const rawItems = document.getElementById('prod-items').value
        .split('\n')
        .map(line => line.trim())
        .filter(Boolean);

      if (existingId) {
        const prod = state.products.find(p => p.id === existingId);
        if (prod) {
          prod.categoryId = categoryId;
          prod.name = name;
          prod.price = price;
          prod.stock = stock;
          prod.deliveryMode = deliveryMode;
          prod.sheetUrl = sheetUrl;
          prod.directLink = directLink;
          prod.fileUrl = fileUrl;
          prod.fileName = fileName;
          prod.description = description;
          prod.stockItems = rawItems;
        }
        showToast('প্রোডাক্ট আপডেট হয়েছে!', 'success');
      } else {
        state.products.unshift({
          id: generateId('PRD'),
          categoryId,
          name,
          price,
          stock,
          deliveryMode,
          sheetUrl,
          directLink,
          fileUrl,
          fileName,
          description,
          stockItems: rawItems
        });
        showToast('নতুন প্রোডাক্ট যোগ করা হয়েছে!', 'success');
      }
      closeModal();
      renderApp();
    }

    function deleteProduct(prodId) {

      return `

                    }">
                      ${dep.status === 'approved' ? 'অ্যাপ্রুভড' : dep.status === 'rejected' ? 'বাতিল' : 'পেন্ডিং'}
                    </span>

                  <p class="text-[11px] text-slate-400 mt-0.5">${escapeHtml(dep.createdAt)}</p>
                </div>
                <div class="text-right shrink-0">

                  ${dep.usdAmount ? `<span class="text-xs font-bold text-amber-600 font-mono">$${dep.usdAmount} USDT</span>` : ''}
                </div>

                <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-100">
                  <button onclick="processDeposit('${dep.id}', 'approved')" class="py-2.5 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-sm transition">

                  <button onclick="processDeposit('${dep.id}', 'rejected')" class="py-2.5 rounded-2xl bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold text-xs border border-rose-200 transition">

          `).join('')}

      `;
    }

    function processDeposit(depId, action) {
      const dep = state.deposits.find(d => d.id === depId);
      if (!dep || dep.status !== 'pending') return;
      dep.status = action;
      if (action === 'approved') {
        const targetUser = state.users.find(u => u.id === dep.userId) || getCurrentUser();
        targetUser.balance += dep.amountBdt;
        showToast(`${formatBDT(dep.amountBdt)} "${targetUser.name}" এর ব্যালেন্সে যোগ করা হয়েছে!`, 'success');
      } else {
        showToast('ডিপোজিট রিকোয়েস্ট বাতিল করা হয়েছে।', 'info');
      }
      renderApp();
    }

    function saveOrderDelivery(e, orderId) {
      e.preventDefault();
      const order = state.orders.find(o => o.id === orderId);
      if (!order) return;
      const sheetUrl = document.getElementById('deliver-sheet-input').value.trim();
      const directLink = document.getElementById('deliver-link-input').value.trim();
      const fileUrl = tempUploads.orderFileUrl || '';
      const fileName = tempUploads.orderFileName || '';
      const textData = document.getElementById('deliver-data-input').value.trim();
      if (!sheetUrl && !directLink && !fileUrl && !textData) {
        showToast('অনুগ্রহ করে গুগল শিট, লিংক, ফাইল অথবা অ্যাকাউন্ট তথ্য দিন।', 'warning');
        return;
      }
      order.deliveredSheetUrl = sheetUrl;
      order.deliveredDirectLink = directLink;
      order.deliveredFileUrl = fileUrl;
      order.deliveredFileName = fileName;
      order.deliveredData = textData;
      order.status = 'completed';
      closeModal();
      showToast('অর্ডার সফলভাবে ডেলিভারি করা হয়েছে!', 'success');

    function applyUserBalanceChange(e, userId) {
      e.preventDefault();
      const user = state.users.find(u => u.id === userId);
      if (!user) return;
      const type = document.getElementById('bal-action-type').value;
      const amount = parseFloat(document.getElementById('bal-amount-input').value);
      const note = document.getElementById('bal-note-input').value.trim() || 'এডমিন অ্যাডজাস্টমেন্ট';

      if (isNaN(amount) || amount < 0) {
        showToast('সঠিক টাকার পরিমাণ দিন।', 'error');
        return;
      }

      if (type === 'add') {
        user.balance += amount;
      } else if (type === 'deduct') {
        user.balance = Math.max(0, user.balance - amount);
      } else {
        user.balance = amount;
      }

      state.balanceLogs.unshift({
        id: generateId('LOG'),
        userId: user.id,
        type,
        amount,
        note,
        createdAt: getNowTime()
      });

      closeModal();
      showToast(`"${user.name}" এর নতুন ব্যালেন্স ${formatBDT(user.balance)} করা হয়েছে!`, 'success');
      renderApp();
    }

          <div class="flex items-center justify-between gap-2">
            <div>
              <h3 class="text-sm font-bold text-slate-800">পেমেন্ট অন/অফ, নাম্বার ও লোগো</h3>
              <p class="text-[11px] text-slate-500">যেকোনো মাধ্যম সুইচ দিয়ে চালু বা বন্ধ রাখুন</p>
            </div>
            <button onclick="openPaymentMethodModal()" class="shrink-0 text-xs font-bold bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-xl">
              + নতুন মাধ্যম
            </button>
          </div>

          <div class="space-y-2.5">
            ${state.paymentMethods.map(m => `
              <div class="border border-slate-200/80 rounded-2xl p-3 flex items-center justify-between gap-3 transition ${m.active ? 'bg-white' : 'bg-slate-100/80 opacity-75'}">
                <div class="flex items-center gap-3 min-w-0">
                  ${renderPaymentLogo(m, 'w-11 h-11')}
                  <div class="min-w-0">
                    <div class="flex items-center gap-1.5">
                      <span class="font-bold text-sm text-slate-900 truncate">${escapeHtml(m.name)}</span>
                      ${m.isBinance ? '<span class="text-[10px] bg-amber-100 text-amber-900 font-bold px-1.5 py-0.5 rounded-md">USD</span>' : ''}
                    </div>
                    <p class="text-xs font-mono font-bold text-indigo-700 truncate">${escapeHtml(m.number)}</p>
                    <p class="text-[10px] ${m.active ? 'text-emerald-600 font-semibold' : 'text-rose-500 font-semibold'}">${m.active ? '● চালু আছে (ডিপোজিটে দেখাবে)' : '○ বন্ধ আছে (হাইড করা)'}</p>
                  </div>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                  <!-- Clean Visual ON/OFF Toggle Switch -->
                  <button onclick="togglePaymentActive('${m.id}')" title="${m.active ? 'বন্ধ করুন' : 'চালু করুন'}"
                    class="relative inline-flex h-7 w-12 items-center rounded-full transition-colors ${m.active ? 'bg-emerald-500' : 'bg-slate-300'}">
                    <span class="inline-block h-5 w-5 transform rounded-full bg-white shadow transition-transform ${m.active ? 'translate-x-6' : 'translate-x-1'}"></span>
                  </button>
                  <button onclick="openPaymentMethodModal('${m.id}')" class="text-xs font-bold bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-3 py-1.5 rounded-xl">
                    এডিট
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function saveGeneralSettings(e) {
      e.preventDefault();
      state.settings.storeName = document.getElementById('set-store-name').value.trim() || 'Digital Store BD';
      state.settings.notice = document.getElementById('set-notice').value.trim();
      state.settings.minDeposit = Math.max(1, parseFloat(document.getElementById('set-min-deposit').value) || 50);
      state.settings.binanceRate = Math.max(1, parseFloat(document.getElementById('set-binance-rate').value) || 120);
      state.settings.adminPin = document.getElementById('set-admin-pin').value.trim() || '1234';
      showToast('স্টোর সেটিংস, মিনিমাম ডিপোজিট ও বাইনান্স রেট সেভ হয়েছে!', 'success');
      renderApp();
    }

    function togglePaymentActive(id) {
      const m = state.paymentMethods.find(x => x.id === id);
      if (!m) return;
      m.active = !m.active;
      showToast(`${m.name} ${m.active ? 'চালু করা হয়েছে!' : 'বন্ধ করা হয়েছে।'}`, m.active ? 'success' : 'info');
      renderApp();
    }

    // Edit or Add Payment Method Modal (Gallery Photo Upload + Number + Binance USD Toggle)
    function openPaymentMethodModal(methodId = null) {
      const existing = methodId ? state.paymentMethods.find(m => m.id === methodId) : null;
      tempUploads.pmLogoUrl = existing ? existing.logoUrl : '';

      openModal(`
        <div class="p-5">
          <div class="flex items-center justify-between mb-4">
            <h3 class="font-bold text-base text-slate-900">${existing ? `${escapeHtml(existing.name)} এডিট করুন` : 'নতুন পেমেন্ট মাধ্যম যোগ করুন'}</h3>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center">✕</button>
          </div>
          <form onsubmit="savePaymentMethod(event, '${existing ? existing.id : ''}')" class="space-y-3">
            <!-- Gallery Logo Upload Box for bKash / Nagad / Rocket / Upay / Binance -->
            <div class="flex items-center gap-3 bg-slate-50 border border-slate-200 rounded-2xl p-3">
              <div id="pm-logo-preview" class="w-12 h-12 rounded-xl overflow-hidden bg-white border border-slate-200 flex items-center justify-center shrink-0">
                ${existing ? renderPaymentLogo(existing, 'w-12 h-12') : `<div class="w-12 h-12">${DEFAULT_LOGOS.custom}</div>`}
              </div>
              <div class="flex-1 min-w-0">
                <p class="text-xs font-bold text-slate-800">পেমেন্ট লোগো (গ্যালারি থেকে আপলোড)</p>
                <div class="flex items-center gap-2 mt-1.5 flex-wrap">
                  <label class="cursor-pointer bg-indigo-600 hover:bg-indigo-700 text-white text-[11px] font-bold px-3 py-1.5 rounded-xl inline-block">
                    📷 গ্যালারি থেকে ফটো নিন
                    <input type="file" accept="image/*" class="hidden" onchange="handleGalleryImagePick(this, 'pmLogoUrl', 'pm-logo-preview')" />
                  </label>
                  <button type="button" onclick="tempUploads.pmLogoUrl=''; document.getElementById('pm-logo-url').value=''; showToast('ডিফল্ট লোগো ব্যবহার হবে।', 'info');"
                    class="text-[11px] font-bold text-slate-500 hover:text-rose-600">ডিফল্ট লোগো</button>
                </div>
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">মাধ্যমের নাম</label>
              <input type="text" id="pm-name" required value="${existing ? escapeHtml(existing.name) : ''}" placeholder="যেমন: বিকাশ (bKash) বা সেলফিন"
                class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500" />
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">আপনার নাম্বার / Binance Pay ID</label>
              <input type="text" id="pm-number" required value="${existing ? escapeHtml(existing.number) : ''}" placeholder="যেমন: 017XXXXXXXX বা Pay ID"
                class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-2.5 text-sm font-mono font-bold focus:outline-none focus:border-indigo-500" />
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">অ্যাকাউন্টের ধরন / নির্দেশনা</label>
              <input type="text" id="pm-type" required value="${existing ? escapeHtml(existing.type) : 'Personal • Send Money'}" placeholder="যেমন: Personal • Send Money / Agent"
                class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500" />
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">অথবা লোগো লিংক (Image URL - ঐচ্ছিক)</label>
              <input type="url" id="pm-logo-url" value="${existing && !existing.logoUrl.startsWith('blob:') ? escapeHtml(existing.logoUrl) : ''}" placeholder="https://example.com/logo.png"
                class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-2.5 text-xs focus:outline-none focus:border-indigo-500" />
            </div>
            <label class="flex items-center gap-2.5 bg-amber-50 border border-amber-200 rounded-2xl p-3 cursor-pointer">
              <input type="checkbox" id="pm-is-binance" ${existing && existing.isBinance ? 'checked' : ''} class="w-4 h-4 accent-amber-600 rounded" />
              <div>
                <span class="block text-xs font-bold text-amber-950">ডলার / বাইনান্স মোড চালু করুন</span>
                <span class="block text-[10px] text-amber-800">টাকার পরিমাণ দিলে অটোমেটিক ডলার (USDT) হিসাব দেখাবে।</span>
              </div>
            </label>
            <div class="flex gap-2 pt-1">
              <button type="submit" class="flex-1 py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm">
                সেভ করুন
              </button>
              ${existing && !['bkash','nagad','rocket','upay','binance'].includes(existing.id) ? `
                <button type="button" onclick="deletePaymentMethod('${existing.id}')" class="px-4 py-3 rounded-2xl bg-rose-50 text-rose-600 font-bold text-sm border border-rose-200">
                  মুছুন
                </button>
              ` : ''}
            </div>
          </form>
        </div>
      `);
    }

    function savePaymentMethod(e, existingId) {
      e.preventDefault();
      const name = document.getElementById('pm-name').value.trim();
      const number = document.getElementById('pm-number').value.trim();
      const type = document.getElementById('pm-type').value.trim();
      const typedLogoUrl = document.getElementById('pm-logo-url').value.trim();
      // Prioritize newly uploaded gallery photo over typed URL
      const logoUrl = (tempUploads.pmLogoUrl && tempUploads.pmLogoUrl.startsWith('blob:'))
        ? tempUploads.pmLogoUrl
        : (typedLogoUrl || tempUploads.pmLogoUrl || '');
      const isBinance = document.getElementById('pm-is-binance').checked;

      if (existingId) {
        const m = state.paymentMethods.find(x => x.id === existingId);
        if (m) {
          m.name = name;
          m.number = number;
          m.type = type;
          m.logoUrl = logoUrl;
          m.isBinance = isBinance;
        }
        showToast('পেমেন্ট মাধ্যম ও লোগো আপডেট করা হয়েছে!', 'success');
      } else {
        state.paymentMethods.push({
          id: generateId('PM'),
          name,
          number,
          type,
          color: '#4F46E5',
          logoKey: isBinance ? 'binance' : 'custom',
          logoUrl,
          isBinance,
          active: true
        });
        showToast('নতুন পেমেন্ট মাধ্যম যুক্ত হয়েছে!', 'success');
      }
      closeModal();
      renderApp();
    }

    function deletePaymentMethod(id) {
      state.paymentMethods = state.paymentMethods.filter(m => m.id !== id);
      closeModal();
      showToast('পেমেন্ট মাধ্যম মুছে ফেলা হয়েছে।', 'info');
      renderApp();
    }

    /**
     * ===================================================================
     * 9. MAIN RENDER LOOP & INITIALIZATION
     * ===================================================================
     */
    function renderApp() {
      try {
        updateHeaderAndNav();
        const main = document.getElementById('main-content');
        if (state.activeTab === 'shop') {
          main.innerHTML = renderShopView();
        } else if (state.activeTab === 'deposit') {
          main.innerHTML = renderDepositView();
        } else if (state.activeTab === 'orders') {
          main.innerHTML = renderOrdersView();
        } else if (state.activeTab === 'admin') {
          main.innerHTML = renderAdminView();
        }
      } catch (error) {
        console.error('Render Error:', error);
        showToast('অ্যাপ লোড করতে সমস্যা হয়েছে।', 'error');
      }
    }

    // Boot App on Load
    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
  </script>
</body>
</html>
