      scrollbar-width: none;
    }
    /* Subtle modal slide-up animation */
    @keyframes slideUp {
      from { transform: translateY(24px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up {
      animation: slideUp 0.22s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-fade-in {
      animation: fadeIn 0.2s ease-out forwards;

    /**
     * ===================================================================
     * 3B. GOOGLE SHEET COLUMN A PARSER, AUTO-STOCK SYNC & FORMAT EXPORTERS
     * ===================================================================
     */
    // Extract Google Sheet ID & optional Tab GID from any standard Google Sheets URL
    function parseGoogleSheetUrl(url) {
      if (!url || typeof url !== 'string') return null;
      const idMatch = url.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
      if (!idMatch) return null;
      const gidMatch = url.match(/[#&?]gid=([0-9]+)/);
      return {
        sheetId: idMatch[1],
        gid: gidMatch ? gidMatch[1] : null
      };
    }

    // Format a multi-column row cleanly as one serial stock entry (Preserves Col A, B, C, D...)
    function formatRowCellsToLine(cells) {
      return cells.map(c => String(c || '').trim()).join(' | ');
    }

    // Split a stored stock/delivery line back into separate columns (Col A, B, C...) for Google Sheet CSV export
    function splitLineToColumns(line) {
      const text = String(line || '').trim();
      if (!text) return [];
      if (text.includes('\t')) {
        return text.split('\t').map(c => c.trim());
      }
      if (text.includes(' | ')) {
        return text.split(' | ').map(c => c.trim());
      }
      if (text.includes('|')) {
        return text.split('|').map(c => c.trim());
      }
      return [text];
    }

    // RFC-4180 Compliant CSV Parser:
    // Counts stock STRICTLY by non-empty Column A rows (1, 2, 3...) while preserving Column B, C, D... data together
    function extractColumnAFromCsv(csvText, skipHeader = false) {
      const rows = [];
      let currentRow = [];
      let currentField = '';
      let inQuotes = false;

      for (let i = 0; i < csvText.length; i++) {
        const ch = csvText[i];
        const next = csvText[i + 1];

        if (inQuotes) {
          if (ch === '"' && next === '"') {
            currentField += '"';
            i++;
          } else if (ch === '"') {
            inQuotes = false;
          } else {
            currentField += ch;
          }
        } else {
          if (ch === '"') {
            inQuotes = true;
          } else if (ch === ',') {
            currentRow.push(currentField);
            currentField = '';
          } else if (ch === '\r' && next === '\n') {
            currentRow.push(currentField);
            rows.push(currentRow);
            currentRow = [];
            currentField = '';
            i++;
          } else if (ch === '\n' || ch === '\r') {
            currentRow.push(currentField);
            rows.push(currentRow);
            currentRow = [];
            currentField = '';
          } else {
            currentField += ch;
          }
        }
      }
      if (currentField.length > 0 || currentRow.length > 0) {
        currentRow.push(currentField);
        rows.push(currentRow);
      }

      const startIndex = skipHeader ? 1 : 0;
      const serialItems = [];
      let maxCols = 1;

      for (let r = startIndex; r < rows.length; r++) {
        const row = rows[r];
        // Main stock count rule: Column A (index 0) MUST have data for this row to count as 1 serial piece
        const colA = (row[0] || '').trim();
        if (colA === '') continue;

        // Trim only trailing empty columns so Column B, C, D... remain intact even if an intermediate cell exists
        let lastNonEmptyIdx = 0;
        for (let c = 0; c < row.length; c++) {
          if ((row[c] || '').trim() !== '') {
            lastNonEmptyIdx = c;
          }
        }
        const activeCells = row.slice(0, lastNonEmptyIdx + 1).map(cell => (cell || '').trim());
        if (activeCells.length > maxCols) maxCols = activeCells.length;
        serialItems.push(formatRowCellsToLine(activeCells));
      }

      return { items: serialItems, maxCols };
    }

    // Helper to display column letters cleanly (e.g., 1 -> "A", 3 -> "A, B, C")
    function formatColumnLabels(colCount) {
      const count = Math.max(1, Math.min(colCount || 1, 10));
      const letters = [];
      for (let i = 0; i < count; i++) {
        letters.push(String.fromCharCode(65 + i));
      }
      return letters.join(', ');
    }

    // Fetch live Google Sheet rows counted by Column A (with B, C, D... preserved) via CORS-friendly gviz CSV endpoint
    async function fetchGoogleSheetColumnA(sheetUrl, skipHeader = false) {
      const parsed = parseGoogleSheetUrl(sheetUrl);
      if (!parsed) {
        return { ok: false, error: 'সঠিক গুগল শিট লিংক দিন (যেমন: https://docs.google.com/spreadsheets/d/...)' };
      }
      const endpoints = [
        `https://docs.google.com/spreadsheets/d/${parsed.sheetId}/gviz/tq?tqx=out:csv${parsed.gid ? `&gid=${parsed.gid}` : ''}`,
        `https://docs.google.com/spreadsheets/d/${parsed.sheetId}/export?format=csv${parsed.gid ? `&gid=${parsed.gid}` : ''}`
      ];

      let lastErr = '';
      for (const endpoint of endpoints) {
        try {
          const res = await fetch(endpoint, { mode: 'cors' });
          if (!res.ok) {
            lastErr = `HTTP ${res.status}`;
            continue;
          }
          const text = await res.text();
          // Detect HTML login redirect if sheet is private
          if (text.trim().startsWith('<!DOCTYPE') || text.trim().startsWith('<html')) {
            return {
              ok: false,
              error: 'শিটটি প্রাইভেট! গুগল শিটে Share → Anyone with the link → Viewer করে আবার চেষ্টা করুন।'
            };
          }
          const parsedSheet = extractColumnAFromCsv(text, skipHeader);
          return {
            ok: true,
            items: parsedSheet.items,
            totalCount: parsedSheet.items.length,
            maxCols: parsedSheet.maxCols
          };
        } catch (err) {
          lastErr = err.message || 'Network error';
        }
      }
      return {
        ok: false,
        error: `গুগল শিট পড়া যায়নি (${lastErr})। শিটটি "Anyone with the link (Viewer)" পাবলিক আছে কিনা চেক করুন।`
      };
    }

    // Calculate live available stock for a Category (uses explicit manualStock if set, else sum of product stocks)
    function getCategoryStockInfo(cat) {
      const catProducts = state.products.filter(p => p.categoryId === cat.id);
      const productsSum = catProducts.reduce((sum, p) => sum + (Number(p.stock) || 0), 0);
      const hasManualStock = cat.manualStock !== null && cat.manualStock !== undefined && cat.manualStock !== '';
      const displayStock = hasManualStock ? Math.max(0, Number(cat.manualStock) || 0) : productsSum;
      return {
        displayStock,
        productsSum,
        hasManualStock,
        productCount: catProducts.length
      };
    }

    // Sync a Category's Google Sheet Column A count directly into its Stock
    async function syncCategorySheetStock(catId) {
      const cat = state.categories.find(c => c.id === catId);
      if (!cat || !cat.sheetUrl) {
        showToast('এই ক্যাটাগরিতে কোনো গুগল শিট লিংক সেট করা নেই।', 'warning');

      showToast(`"${cat.name}" এর গুগল শিট (কলাম A সিরিয়াল) চেক করা হচ্ছে...`, 'info');
      const result = await fetchGoogleSheetColumnA(cat.sheetUrl, Boolean(cat.sheetSkipHeader));
      if (!result.ok) {
        showToast(result.error, 'error');
        return;
      }
      cat.sheetTotalCount = result.totalCount;
      cat.manualStock = result.totalCount;
      cloudSaveDoc('categories', cat.id, cat);
      const colInfo = formatColumnLabels(result.maxCols);
      showToast(`✓ "${cat.name}" এর A কলাম অনুযায়ী মোট ${result.totalCount} পিস (কলাম ${colInfo} সহ) স্টকে আপডেট হয়েছে!`, 'success');
      renderApp();
    }

    // Sync a Product's Google Sheet Column A serial list (with Col B, C... intact) into stock & auto-delivery queue
    async function syncProductSheetStock(prodId) {
      const prod = state.products.find(p => p.id === prodId);
      if (!prod) return;
      const { sheetUrl } = getEffectiveDeliveryConfig(prod);
      if (!sheetUrl) {
        showToast('এই প্রোডাক্ট বা ক্যাটাগরিতে কোনো গুগল শিট লিংক সেট করা নেই।', 'warning');
        return;
      }
      showToast(`"${prod.name}" এর গুগল শিট (A কলাম সিরিয়াল) সিঙ্ক হচ্ছে...`, 'info');
      const result = await fetchGoogleSheetColumnA(sheetUrl, Boolean(prod.sheetSkipHeader));
      if (!result.ok) {
        showToast(result.error, 'error');
        return;
      }
      const alreadyDelivered = Math.max(0, Number(prod.sheetDeliveredCount) || 0);
      const remainingItems = result.items.slice(alreadyDelivered);
      prod.sheetTotalCount = result.totalCount;
      prod.stockItems = remainingItems;
      prod.stock = remainingItems.length;
      prod.sheetLastSynced = getNowTime();
      cloudSaveDoc('products', prod.id, prod);
      const colInfo = formatColumnLabels(result.maxCols);
      showToast(
        `✓ A কলাম সিরিয়াল: মোট ${result.totalCount} পিস (কলাম ${colInfo} সহ • বাকি ${remainingItems.length} পিস)!`,
        'success'
      );
      renderApp();
    }

    // Trigger clean downloadable Google Sheet-compatible CSV file preserving Column A, B, C... separately!
    function downloadOrderAsSheetCsv(orderId) {
      const order = state.orders.find(o => o.id === orderId);
      if (!order) return;
      const lines = (order.deliveredData || '')
        .split('\n')
        .map(l => l.trim())
        .filter(Boolean);
      if (lines.length === 0) {
        showToast('ডাউনলোড করার মতো কোনো আইটেম পাওয়া যায়নি।', 'warning');
        return;
      }
      // Build UTF-8 BOM CSV keeping Column A, Column B, Column C... in their exact separate spreadsheet columns
      const csvRows = lines.map(line => {
        const cols = splitLineToColumns(line);
        return cols.map(cell => `"${cell.replace(/"/g, '""')}"`).join(',');
      });
      const csvContent = '\uFEFF' + csvRows.join('\r\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${order.id}_GoogleSheet.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1500);
      showToast('গুগল শিট ফাইল (.csv) ডাউনলোড হয়েছে! কলাম A, B, C আলাদা ঘরে সুন্দরভাবে ওপেন হবে।', 'success');
    }
        } else {
          if (ch === '"') {
            inQuotes = true;
          } else if (ch === ',') {
            currentRow.push(currentField);
            currentField = '';
          } else if (ch === '\r' && next === '\n') {
            currentRow.push(currentField);
            rows.push(currentRow);
            currentRow = [];
            currentField = '';
            i++;
          } else if (ch === '\n' || ch === '\r') {
            currentRow.push(currentField);
            rows.push(currentRow);
            currentRow = [];
            currentField = '';
          } else {
            currentField += ch;
          }
        }
      }
      if (currentField.length > 0 || currentRow.length > 0) {
        currentRow.push(currentField);
        rows.push(currentRow);
      }

      const startIndex = skipHeader ? 1 : 0;
      const colAItems = [];
      for (let r = startIndex; r < rows.length; r++) {
        const val = (rows[r][0] || '').trim();
        if (val !== '') {
          colAItems.push(val);
        }
      }
      return colAItems;
    }

    // Fetch live Google Sheet Column A entries via CORS-friendly gviz CSV endpoint (with export fallback)
    async function fetchGoogleSheetColumnA(sheetUrl, skipHeader = false) {
      const parsed = parseGoogleSheetUrl(sheetUrl);
      if (!parsed) {
        return { ok: false, error: 'সঠিক গুগল শিট লিংক দিন (যেমন: https://docs.google.com/spreadsheets/d/...)' };
      }
      const endpoints = [
        `https://docs.google.com/spreadsheets/d/${parsed.sheetId}/gviz/tq?tqx=out:csv${parsed.gid ? `&gid=${parsed.gid}` : ''}`,
        `https://docs.google.com/spreadsheets/d/${parsed.sheetId}/export?format=csv${parsed.gid ? `&gid=${parsed.gid}` : ''}`
      ];

      let lastErr = '';
      for (const endpoint of endpoints) {
        try {
          const res = await fetch(endpoint, { mode: 'cors' });
          if (!res.ok) {
            lastErr = `HTTP ${res.status}`;
            continue;
          }
          const text = await res.text();
          // Detect HTML login redirect if sheet is private
          if (text.trim().startsWith('<!DOCTYPE') || text.trim().startsWith('<html')) {
            return {
              ok: false,
              error: 'শিটটি প্রাইভেট! গুগল শিটে Share → Anyone with the link → Viewer করে আবার চেষ্টা করুন।'
            };
          }
          const items = extractColumnAFromCsv(text, skipHeader);
          return { ok: true, items, totalCount: items.length };
        } catch (err) {
          lastErr = err.message || 'Network error';
        }
      }
      return {
        ok: false,
        error: `গুগল শিট পড়া যায়নি (${lastErr})। শিটটি "Anyone with the link (Viewer)" পাবলিক আছে কিনা চেক করুন।`
      };
    }

    // Calculate live available stock for a Category (uses explicit manualStock if set, else sum of product stocks)
    function getCategoryStockInfo(cat) {
      const catProducts = state.products.filter(p => p.categoryId === cat.id);
      const productsSum = catProducts.reduce((sum, p) => sum + (Number(p.stock) || 0), 0);
      const hasManualStock = cat.manualStock !== null && cat.manualStock !== undefined && cat.manualStock !== '';
      const displayStock = hasManualStock ? Math.max(0, Number(cat.manualStock) || 0) : productsSum;
      return {
        displayStock,
        productsSum,
        hasManualStock,
        productCount: catProducts.length
      };
    }

    // Sync a Category's Google Sheet Column A count directly into its Stock
    async function syncCategorySheetStock(catId) {
      const cat = state.categories.find(c => c.id === catId);
      if (!cat || !cat.sheetUrl) {
        showToast('এই ক্যাটাগরিতে কোনো গুগল শিট লিংক সেট করা নেই।', 'warning');
        return;

      showToast(`"${cat.name}" এর গুগল শিট (কলাম A) চেক করা হচ্ছে...`, 'info');
      const result = await fetchGoogleSheetColumnA(cat.sheetUrl, Boolean(cat.sheetSkipHeader));
      if (!result.ok) {
        showToast(result.error, 'error');
        return;
      }
      cat.sheetTotalCount = result.totalCount;
      cat.manualStock = result.totalCount;
      cloudSaveDoc('categories', cat.id, cat);
      showToast(`✓ "${cat.name}" শিটের A কলামে মোট ${result.totalCount} পিস পাওয়া গেছে এবং স্টক আপডেট হয়েছে!`, 'success');
      renderApp();

    // Sync a Product's Google Sheet Column A serial list directly into stock & auto-delivery queue
    async function syncProductSheetStock(prodId) {
      const prod = state.products.find(p => p.id === prodId);
      if (!prod) return;
      const { sheetUrl } = getEffectiveDeliveryConfig(prod);
      if (!sheetUrl) {
        showToast('এই প্রোডাক্ট বা ক্যাটাগরিতে কোনো গুগল শিট লিংক সেট করা নেই।', 'warning');
        return;
      }
      showToast(`"${prod.name}" এর গুগল শিট (A কলাম) সিঙ্ক হচ্ছে...`, 'info');
      const result = await fetchGoogleSheetColumnA(sheetUrl, Boolean(prod.sheetSkipHeader));
      if (!result.ok) {
        showToast(result.error, 'error');
        return;
      }
      const alreadyDelivered = Math.max(0, Number(prod.sheetDeliveredCount) || 0);
      const remainingItems = result.items.slice(alreadyDelivered);
      prod.sheetTotalCount = result.totalCount;
      prod.stockItems = remainingItems;
      prod.stock = remainingItems.length;
      prod.sheetLastSynced = getNowTime();
      cloudSaveDoc('products', prod.id, prod);
      showToast(
        `✓ A কলামে মোট ${result.totalCount} পিস (${alreadyDelivered} ডেলিভারড, ${remainingItems.length} পিস স্টকে বাকি)!`,
        'success'
      );
      renderApp();
    }

    // Escape HTML to safely render user/admin text
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Format BDT currency cleanly
    function formatBDT(amount) {
      const num = Number(amount) || 0;
      return '৳ ' + num.toLocaleString('en-US', { minimumFractionDigits: num % 1 === 0 ? 0 : 2, maximumFractionDigits: 2 });
    }

    // Generate short readable ID
    function generateId(prefix) {
      return prefix + '_' + Math.random().toString(36).substring(2, 8).toUpperCase();
    }

    // Format current time
    function getNowTime() {
      const now = new Date();
      return now.toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' }) + ', ' +
             now.toLocaleDateString('bn-BD', { day: 'numeric', month: 'short' });
    }

    // Reliable Clipboard Copy inside iFrames using document.execCommand('copy')
    function copyText(text, label = 'কপি করা হয়েছে!') {
      try {
        const tempInput = document.createElement('textarea');
        tempInput.value = text;
        tempInput.style.position = 'fixed';
        tempInput.style.opacity = '0';
        document.body.appendChild(tempInput);
        tempInput.focus();
        tempInput.select();
        document.execCommand('copy');
        document.body.removeChild(tempInput);
        showToast(label, 'success');
      } catch (err) {
        showToast('কপি করতে সমস্যা হয়েছে, ম্যানুয়ালি কপি করুন।', 'error');
      }
    }

    // Custom Toast Notification (Never uses alert())
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const styles = {
        success: 'bg-emerald-600 text-white shadow-emerald-600/30',
        error: 'bg-rose-600 text-white shadow-rose-600/30',
        info: 'bg-slate-800 text-white shadow-slate-900/30',
        warning: 'bg-amber-500 text-amber-950 shadow-amber-500/30'
      };
      const icons = {
        success: '✓',
        error: '✕',
        info: 'ℹ',
        warning: '!'
      };
      toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-2xl shadow-lg text-sm font-medium animate-slide-up ${styles[type] || styles.info}`;
      toast.innerHTML = `
        <span class="w-5 h-5 rounded-full bg-white/20 flex items-center justify-center text-xs font-bold shrink-0">${icons[type] || 'ℹ'}</span>
        <span class="flex-1 leading-snug">${escapeHtml(message)}</span>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-8px)';
        toast.style.transition = 'all 0.25s ease';
        setTimeout(() => toast.remove(), 260);
      }, 2800);
    }

    // Render Payment Method Logo (Supports Gallery / URL Logo with seamless fallback to SVG)
    function renderPaymentLogo(method, sizeClass = 'w-10 h-10') {
      const fallbackSvg = DEFAULT_LOGOS[method.logoKey] || DEFAULT_LOGOS.custom;
      if (method.logoUrl && method.logoUrl.trim() !== '') {
        const safeUrl = escapeHtml(method.logoUrl.trim());
        const fallbackEncoded = encodeURIComponent(method.name.substring(0, 2));
        const hexColor = (method.color || '#4F46E5').replace('#', '');
        return `
          <div class="${sizeClass} rounded-xl overflow-hidden shrink-0 bg-white border border-slate-200 flex items-center justify-center shadow-sm">
            <img src="${safeUrl}" alt="${escapeHtml(method.name)}" class="w-full h-full object-cover"
                 onerror="this.onerror=null; this.src='https://placehold.co/96x96/${hexColor}/ffffff?text=${fallbackEncoded}';" />
          </div>
        `;
      }
      return `<div class="${sizeClass} rounded-xl overflow-hidden shrink-0 shadow-sm">${fallbackSvg}</div>`;
    }

              <input type="text" id="new-usr-name" required placeholder="ইউজার নাম" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-indigo-500" />
              <input type="text" id="new-usr-phone" required placeholder="মোবাইল নাম্বার" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-indigo-500" />
            </div>
            <button type="submit" class="w-full py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs">
              + নতুন ইউজার তৈরি ও লগইন
            </button>
          </form>
        </div>
      `);
    }

    function updateCurrentUserProfile(e) {
      e.preventDefault();
      const user = getCurrentUser();
      const name = document.getElementById('edit-profile-name').value.trim();
      const phone = document.getElementById('edit-profile-phone').value.trim();
      if (!name || !phone) return;
      user.name = name;
      user.phone = phone;
      cloudSaveDoc('users', user.id, user);
      closeModal();
      showToast('আপনার প্রোফাইল আপডেট হয়েছে!', 'success');
      renderApp();
    }

    function switchActiveUser(userId) {
      state.currentUserId = userId;
      closeModal();
      const u = getCurrentUser();
      showToast(`এখন "${u.name}" হিসেবে লগইন আছেন।`, 'info');
      renderApp();
    }

    function registerQuickUser(e) {
      e.preventDefault();
      const name = document.getElementById('new-usr-name').value.trim();
      const phone = document.getElementById('new-usr-phone').value.trim();
      if (!name || !phone) return;
      const newUser = {
        id: generateId('USR'),
        name,
        phone,
        balance: 0,
        blocked: false,
        joinedAt: getNowTime(),
        createdAtTs: Date.now()
      };
      state.users.unshift(newUser);
      state.currentUserId = newUser.id;
      cloudSaveDoc('users', newUser.id, newUser);
      closeModal();
      showToast(`নতুন ইউজার "${name}" তৈরি হয়েছে!`, 'success');
      renderApp();
    }

    // Blocked Account Alert Banner
    function renderBlockedBanner() {
      return `
        <div class="bg-rose-50 border-2 border-rose-300 rounded-3xl p-4 flex items-start gap-3">
          <div class="w-10 h-10 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center text-xl shrink-0">🚫</div>
          <div>
            <h3 class="font-bold text-sm text-rose-900">আপনার অ্যাকাউন্টটি ব্লক করা হয়েছে!</h3>
            <p class="text-xs text-rose-700 mt-0.5 leading-relaxed">এডমিন আপনার অ্যাকাউন্টটি সাময়িকভাবে বন্ধ রেখেছেন। বর্তমানে আপনি কোনো ডিপোজিট বা অর্ডার করতে পারবেন না।</p>
          </div>
        </div>
      `;
    }

    /**
     * ===================================================================
     * 5. VIEW 1: SHOP / STOREFRONT (ক্যাটাগরি ফোল্ডার ও সব প্রোডাক্ট)
     * ===================================================================
     */
    function renderShopView() {
      const currentUser = getCurrentUser();
      const q = state.searchQuery.trim().toLowerCase();
      const activeCat = state.selectedCategoryId !== 'all'
        ? state.categories.find(c => c.id === state.selectedCategoryId)
        : null;

      // Decide whether to show the Category Folder Grid or Product Listing
      const showCategoryGrid = !q && state.selectedCategoryId === 'all' && state.shopBrowseMode === 'categories';

      // Filter products by category & search query
      const filteredProducts = state.products.filter(p => {
        const matchCat = state.selectedCategoryId === 'all' || p.categoryId === state.selectedCategoryId;
        const cat = state.categories.find(c => c.id === p.categoryId);
        const matchSearch = !q ||
          p.name.toLowerCase().includes(q) ||
          p.description.toLowerCase().includes(q) ||
          (cat && cat.name.toLowerCase().includes(q));
        return matchCat && matchSearch;
      });

      // Build Horizontal Quick Category Pills
      const catPillsHtml = [
        `<button onclick="setShopBrowseMode('categories')" class="shrink-0 px-3.5 py-2 rounded-2xl text-xs sm:text-sm font-semibold transition-all border ${
          showCategoryGrid
            ? 'bg-indigo-600 text-white border-indigo-600 shadow-md shadow-indigo-600/25'
            : 'bg-white text-slate-600 border-slate-200 hover:border-indigo-300'
        }">📂 সব ক্যাটাগরি (${state.categories.length})</button>`,
        `<button onclick="setShopBrowseMode('all')" class="shrink-0 px-3.5 py-2 rounded-2xl text-xs sm:text-sm font-semibold transition-all border ${
          !showCategoryGrid && state.selectedCategoryId === 'all'
            ? 'bg-indigo-600 text-white border-indigo-600 shadow-md shadow-indigo-600/25'
            : 'bg-white text-slate-600 border-slate-200 hover:border-indigo-300'
        }">🔥 সব প্রোডাক্ট (${state.products.length})</button>`,
        ...state.categories.map(cat => {
          const count = state.products.filter(p => p.categoryId === cat.id).length;
          const active = state.selectedCategoryId === cat.id;
          return `
            <button onclick="selectCategory('${cat.id}')" class="shrink-0 px-3.5 py-2 rounded-2xl text-xs sm:text-sm font-semibold transition-all border flex items-center gap-1.5 ${
              active
                ? 'bg-indigo-600 text-white border-indigo-600 shadow-md shadow-indigo-600/25'
                : 'bg-white text-slate-700 border-slate-200 hover:border-indigo-300'
            }">
              ${cat.logoUrl
                ? `<img src="${escapeHtml(cat.logoUrl)}" class="w-4 h-4 rounded-full object-cover" />`
                : `<span>${escapeHtml(cat.icon)}</span>`}
              <span>${escapeHtml(cat.name)}</span>
              <span class="text-xs opacity-75">(${count})</span>
            </button>
          `;
        })
      ].join('');

      // Build All-Categories Visual Folder Grid
      const categoryGridHtml = state.categories.length === 0
        ? `
          <div class="bg-white rounded-3xl border border-slate-200/80 p-8 text-center text-xs text-slate-500">
            এখনো কোনো ক্যাটাগরি যোগ করা হয়নি।
          </div>
        `
        : `
          <div class="grid grid-cols-2 gap-3">
            ${state.categories.map(cat => {
              const catProducts = state.products.filter(p => p.categoryId === cat.id);
              const stockInfo = getCategoryStockInfo(cat);
              const totalStock = stockInfo.displayStock;
              const minPrice = catProducts.length > 0 ? Math.min(...catProducts.map(p => p.price)) : 0;
              return `
                <button onclick="selectCategory('${cat.id}')" class="group bg-white rounded-3xl border border-slate-200/90 hover:border-indigo-400 hover:shadow-md active:scale-[0.98] p-4 text-left transition-all flex flex-col justify-between gap-3 shadow-sm">
                  <div class="flex items-start justify-between gap-2">
                    ${renderCategoryVisual(cat, 'w-12 h-12')}
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-lg ${totalStock > 0 ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-600'}">
                      স্টক: ${totalStock} পিস
                    </span>
                  </div>
                  <div>
                    <h3 class="font-bold text-slate-900 text-base group-hover:text-indigo-700 transition-colors truncate">${escapeHtml(cat.name)}</h3>
                    <p class="text-xs text-slate-500 mt-0.5">${catProducts.length}টি আইটেম ${minPrice > 0 ? `• ${formatBDT(minPrice)} থেকে` : ''}</p>
                    <div class="mt-2 flex items-center justify-between gap-1">
                      ${renderDeliveryBadge(cat.deliveryMode || 'auto')}
                      <span class="text-xs font-bold text-indigo-600 group-hover:translate-x-0.5 transition-transform">দেখুন →</span>
                    </div>
                  </div>
                </button>
              `;
            }).join('')}
          </div>
        `;

      // Build Product Cards (Shown inside a chosen Category, Search, or "All Products" mode)
      const productsHtml = filteredProducts.length === 0
        ? `
          <div class="bg-white rounded-3xl border border-slate-200/80 p-8 text-center">
            <div class="text-4xl mb-2">📦</div>
            <p class="font-semibold text-slate-700">এই ক্যাটাগরিতে কোনো প্রোডাক্ট পাওয়া যায়নি</p>
            <p class="text-xs text-slate-500 mt-1">অন্য ক্যাটাগরি দেখুন অথবা এডমিন প্যানেল থেকে প্রোডাক্ট যোগ করুন।</p>
            ${activeCat ? `<button onclick="setShopBrowseMode('categories')" class="mt-3 px-4 py-2 rounded-xl bg-indigo-50 text-indigo-700 text-xs font-bold">← সব ক্যাটাগরিতে ফিরুন</button>` : ''}
          </div>
        `
        : `
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
            ${filteredProducts.map(prod => {
              const cat = state.categories.find(c => c.id === prod.categoryId);
              const { mode } = getEffectiveDeliveryConfig(prod);
              const inStock = prod.stock > 0;
              return `
                <div class="bg-white rounded-3xl border border-slate-200/90 p-4 shadow-sm hover:shadow-md hover:border-indigo-200 transition-all flex flex-col justify-between">
                  <div>
                    <!-- Top Row: Category & Stock Status -->
                    <div class="flex items-center justify-between gap-2 mb-2">
                      <span class="inline-flex items-center gap-1.5 text-xs font-semibold px-2.5 py-1 rounded-xl bg-slate-100 text-slate-700">
                        ${cat && cat.logoUrl
                          ? `<img src="${escapeHtml(cat.logoUrl)}" class="w-4 h-4 rounded-full object-cover" />`
                          : `<span>${cat ? escapeHtml(cat.icon) : '🏷️'}</span>`}
                        <span>${cat ? escapeHtml(cat.name) : 'সাধারণ'}</span>
                      </span>
                      <span class="inline-flex items-center gap-1 text-xs font-bold px-2.5 py-1 rounded-xl ${
                        inStock ? 'bg-emerald-50 text-emerald-700 border border-emerald-200/70' : 'bg-rose-50 text-rose-600 border border-rose-200/70'
                      }">
                        <span class="w-1.5 h-1.5 rounded-full ${inStock ? 'bg-emerald-500' : 'bg-rose-500'}"></span>
                        ${inStock ? `স্টক: ${prod.stock}টি` : 'স্টক আউট'}
                      </span>
                    </div>

                    <!-- Delivery Mode Badge -->
                    <div class="mb-2">
                      ${renderDeliveryBadge(mode)}
                    </div>

                    <!-- Product Title & Desc -->
                    <h3 class="font-bold text-slate-900 text-base leading-snug">${escapeHtml(prod.name)}</h3>
                    <p class="text-xs text-slate-500 mt-1.5 line-clamp-2 leading-relaxed">${escapeHtml(prod.description)}</p>
                  </div>

                  <!-- Bottom Row: Price & Order Button -->
                  <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between gap-2">
                    <div>
                      <span class="block text-[10px] text-slate-400 font-medium">মূল্য (প্রতি পিস)</span>
                      <span class="text-lg font-bold text-indigo-700">${formatBDT(prod.price)}</span>
                    </div>
                    <button onclick="openBuyModal('${prod.id}')" ${!inStock || currentUser.blocked ? 'disabled' : ''} class="px-4 py-2.5 rounded-2xl text-sm font-bold transition-all ${
                      inStock && !currentUser.blocked
                        ? 'bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white shadow-md shadow-indigo-600/20'
                        : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                    }">
                      ${currentUser.blocked ? 'ব্লকড' : (inStock ? 'অর্ডার করুন' : 'শেষ')}
                    </button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;

      return `
        ${currentUser.blocked ? renderBlockedBanner() : ''}

        <!-- Quick Balance Warning if Balance is 0 -->
        ${!currentUser.blocked && currentUser.balance <= 0 ? `
          <div class="bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-200/80 rounded-3xl p-3.5 flex items-center justify-between gap-3">
            <div class="flex items-center gap-2.5">
              <div class="w-9 h-9 rounded-2xl bg-amber-400/20 text-amber-700 flex items-center justify-center text-lg shrink-0">💰</div>
              <div>
                <p class="text-xs font-bold text-amber-950">অর্ডার করতে প্রথমে টাকা ডিপোজিট করুন</p>
                <p class="text-[11px] text-amber-800">সর্বনিম্ন ডিপোজিট ${formatBDT(state.settings.minDeposit)} • ডিপোজিট ব্যালেন্স দিয়ে যেকোনো মাল নিন</p>
              </div>
            </div>
            <button onclick="switchMainTab('deposit')" class="shrink-0 bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold px-3.5 py-2 rounded-xl shadow-sm active:scale-95 transition">
              ডিপোজিট
            </button>
          </div>
        ` : ''}

        <!-- Search Input -->
        <div class="relative">
          <svg class="w-5 h-5 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <input type="text" id="shop-search" value="${escapeHtml(state.searchQuery)}" oninput="handleSearch(this.value)"
            placeholder="প্রোডাক্ট বা ক্যাটাগরি খুঁজুন (যেমন: Hotmail, Gmail, VPN...)"
            class="w-full bg-white border border-slate-200 rounded-2xl pl-11 pr-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 shadow-sm" />
        </div>

        <!-- Horizontal Quick Category Pills -->
        <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
          ${catPillsHtml}
        </div>

        ${showCategoryGrid ? `
          <!-- Category Folder View (Tap any Category to see all products under it) -->
          <div>
            <div class="flex items-center justify-between mb-2.5">
              <div>
                <h2 class="text-sm font-bold text-slate-800">ক্যাটাগরি নির্বাচন করুন</h2>
                <p class="text-[11px] text-slate-500">যেকোনো ক্যাটাগরিতে ক্লিক করে এর ভেতরের সব আইটেম দেখুন</p>
              </div>
              <button onclick="setShopBrowseMode('all')" class="text-xs font-bold text-indigo-600 hover:underline">
                সব প্রোডাক্ট দেখুন →
              </button>
            </div>
            ${categoryGridHtml}
          </div>
        ` : `
          <!-- Active Category Header Bar (When viewing inside a specific Category like Gmail) -->
          ${activeCat ? `
            <div class="bg-white rounded-3xl border border-indigo-200/80 p-3.5 flex items-center justify-between gap-3 shadow-sm">
              <div class="flex items-center gap-3 min-w-0">
                ${renderCategoryVisual(activeCat, 'w-11 h-11')}
                <div class="min-w-0">
                  <h2 class="font-bold text-slate-900 text-base truncate">${escapeHtml(activeCat.name)}</h2>
                  <p class="text-xs text-slate-500">এই ক্যাটাগরির আন্ডারে মোট ${filteredProducts.length}টি আইটেম</p>
                </div>
              </div>
              <button onclick="setShopBrowseMode('categories')" class="shrink-0 px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition">
                ← সব ক্যাটাগরি
              </button>
            </div>
          ` : `
            <div class="flex items-center justify-between mb-1">
              <h2 class="text-sm font-bold text-slate-700">${q ? 'সার্চ ফলাফল' : 'সব ক্যাটাগরির প্রোডাক্ট'}</h2>
              <span class="text-xs text-slate-400">${filteredProducts.length}টি আইটেম</span>
            </div>
          `}
          ${productsHtml}
        `}
      `;
    }

    function selectCategory(catId) {
      state.selectedCategoryId = catId;
      state.shopBrowseMode = 'all';
      renderApp();
    }

    function setShopBrowseMode(mode) {
      state.selectedCategoryId = 'all';
      state.shopBrowseMode = mode;
      renderApp();
    }

    function handleSearch(val) {
      state.searchQuery = val;
      const activeEl = document.activeElement;
      const cursorPos = activeEl ? activeEl.selectionStart : val.length;
      renderApp();
      const input = document.getElementById('shop-search');
      if (input) {
        input.focus();
        input.setSelectionRange(cursorPos, cursorPos);
      }
    }

    // Buy Product Modal
    let currentBuyState = { productId: null, qty: 1, preferredFormat: 'both' };

    function openBuyModal(productId) {
      const currentUser = getCurrentUser();
      if (currentUser.blocked) {
        showToast('আপনার অ্যাকাউন্ট ব্লক করা হয়েছে! অর্ডার করা সম্ভব নয়।', 'error');
        return;
      }
      const prod = state.products.find(p => p.id === productId);
      if (!prod || prod.stock <= 0) {
        showToast('দুঃখিত, এই প্রোডাক্টটি বর্তমানে স্টকে নেই।', 'error');
        return;
      }
      currentBuyState = { productId, qty: 1, preferredFormat: 'both' };
      renderBuyModalContent();
    }

    function setBuyFormat(fmt) {
      currentBuyState.preferredFormat = fmt;
      renderBuyModalContent();
    }

    function updateBuyQty(delta) {
      const prod = state.products.find(p => p.id === currentBuyState.productId);
      if (!prod) return;
      const next = currentBuyState.qty + delta;
      if (next >= 1 && next <= prod.stock) {
        currentBuyState.qty = next;
        renderBuyModalContent();
      }
    }

    function renderBuyModalContent() {
      const currentUser = getCurrentUser();
      const prod = state.products.find(p => p.id === currentBuyState.productId);
      if (!prod) return;
      const cat = state.categories.find(c => c.id === prod.categoryId);
      const { mode } = getEffectiveDeliveryConfig(prod);
      const totalCost = prod.price * currentBuyState.qty;
      const hasEnoughBalance = currentUser.balance >= totalCost;
      const shortfall = Math.max(0, totalCost - currentUser.balance);
      const pref = currentBuyState.preferredFormat || 'both';

      openModal(`
        <div class="p-5">
          <div class="flex items-start justify-between gap-3 mb-4">
            <div>
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="text-xs font-semibold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-lg">
                  ${cat ? escapeHtml(cat.icon + ' ' + cat.name) : 'প্রোডাক্ট'}
                </span>
                ${renderDeliveryBadge(mode)}
              </div>
              <h3 class="text-lg font-bold text-slate-900 mt-1.5">${escapeHtml(prod.name)}</h3>
              <p class="text-xs text-slate-500 mt-0.5">${escapeHtml(prod.description)}</p>
            </div>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600 shrink-0">✕</button>
          </div>

          <!-- Quantity Selector -->
          <div class="bg-slate-50 border border-slate-200 rounded-2xl p-3.5 flex items-center justify-between mb-3.5">
            <div>
              <span class="text-sm font-bold text-slate-700 block">পরিমাণ (Quantity)</span>
              <span class="text-xs text-slate-500">স্টকে আছে: <strong>${prod.stock} পিস</strong> • প্রতি পিস ${formatBDT(prod.price)}</span>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="updateBuyQty(-1)" class="w-9 h-9 rounded-xl bg-white border border-slate-200 font-bold text-lg text-slate-700 hover:bg-slate-100 active:scale-95">−</button>
              <span class="w-8 text-center font-bold text-base">${currentBuyState.qty}</span>
              <button onclick="updateBuyQty(1)" class="w-9 h-9 rounded-xl bg-white border border-slate-200 font-bold text-lg text-slate-700 hover:bg-slate-100 active:scale-95">+</button>
            </div>
          </div>

          <!-- User Delivery Format Preference: Text OR Google Sheet File OR Both -->
          <div class="mb-4">
            <label class="block text-xs font-bold text-slate-700 mb-1.5">আপনি কীভাবে ডেলিভারি নিতে চান?</label>
            <div class="grid grid-cols-3 gap-2">
              <button type="button" onclick="setBuyFormat('text')" class="p-2.5 rounded-2xl border-2 text-center transition ${
                pref === 'text' ? 'border-indigo-600 bg-indigo-50 text-indigo-800 shadow-sm' : 'border-slate-200 bg-white text-slate-600 hover:border-slate-300'
              }">
                <span class="block text-base">📝</span>
                <span class="block text-[11px] font-bold mt-0.5">টেক্সট আকারে</span>
              </button>
              <button type="button" onclick="setBuyFormat('sheet')" class="p-2.5 rounded-2xl border-2 text-center transition ${
                pref === 'sheet' ? 'border-emerald-600 bg-emerald-50 text-emerald-800 shadow-sm' : 'border-slate-200 bg-white text-slate-600 hover:border-slate-300'
              }">
                <span class="block text-base">📊</span>
                <span class="block text-[11px] font-bold mt-0.5">গুগল শিট ফাইল</span>
              </button>
              <button type="button" onclick="setBuyFormat('both')" class="p-2.5 rounded-2xl border-2 text-center transition ${
                pref === 'both' ? 'border-violet-600 bg-violet-50 text-violet-800 shadow-sm' : 'border-slate-200 bg-white text-slate-600 hover:border-slate-300'
              }">

              </span>

          ${!hasEnoughBalance ? `

            <button onclick="confirmPurchase()" class="w-full py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-lg shadow-indigo-600/25 active:scale-[0.99] transition">
              অর্ডার কনফার্ম করুন (${formatBDT(totalCost)})
            </button>
          `}
        </div>
      `);
    }

    function confirmPurchase() {
      const currentUser = getCurrentUser();
      if (currentUser.blocked) {
        showToast('আপনার অ্যাকাউন্ট ব্লক করা হয়েছে!', 'error');
        return;
      }
      const prod = state.products.find(p => p.id === currentBuyState.productId);
      if (!prod) return;
      const qty = currentBuyState.qty;
      const preferredFormat = currentBuyState.preferredFormat || 'both';
      const total = prod.price * qty;

      if (prod.stock < qty) {
        showToast('স্টকে পর্যাপ্ত প্রোডাক্ট নেই!', 'error');
        return;
      }
      if (currentUser.balance < total) {
        showToast('পর্যাপ্ত ব্যালেন্স নেই! অনুগ্রহ করে ডিপোজিট করুন।', 'error');
        return;
      }

      // Deduct user balance & product stock
      currentUser.balance -= total;
      prod.stock -= qty;

      // Also sync Category explicit manualStock if set by Admin
      const cat = state.categories.find(c => c.id === prod.categoryId);
      if (cat && cat.manualStock !== null && cat.manualStock !== undefined && cat.manualStock !== '') {
        cat.manualStock = Math.max(0, Number(cat.manualStock) - qty);
        cloudSaveDoc('categories', cat.id, cat);
      }

      const { mode, sheetUrl, directLink, fileUrl, fileName } = getEffectiveDeliveryConfig(prod);
      let status = 'pending';
      let deliveredData = '';
      let deliveredSheetUrl = '';
      let deliveredDirectLink = '';
      let deliveredFileUrl = '';
      let deliveredFileName = '';

      if (mode === 'sheet') {
        // Pull exact serial rows from synced Column A queue if available, plus include Google Sheet URL
        if (Array.isArray(prod.stockItems) && prod.stockItems.length >= qty) {
          const serialLines = prod.stockItems.splice(0, qty);
          prod.sheetDeliveredCount = (Number(prod.sheetDeliveredCount) || 0) + qty;
          status = 'completed';
          deliveredData = serialLines.join('\n');
          if (sheetUrl) deliveredSheetUrl = sheetUrl;
        } else if (sheetUrl) {
          status = 'completed';
          deliveredSheetUrl = sheetUrl;
          deliveredData = `আপনার ${prod.name} (×${qty}) এর গুগল শিট ফাইল লিংক নিচে দেওয়া হলো।`;
        } else {
          status = 'pending';
        }
      } else if (mode === 'file' && fileUrl) {
        status = 'completed';
        deliveredFileUrl = fileUrl;
        deliveredFileName = fileName || 'Delivery_File';
        deliveredData = `আপনার ${prod.name} (×${qty}) এর ফাইলটি নিচ থেকে ডাউনলোড করুন।`;
      } else if (mode === 'link' && directLink) {
        status = 'completed';
        deliveredDirectLink = directLink;
        deliveredData = `আপনার ${prod.name} (×${qty}) এর অ্যাক্সেস লিংক নিচে দেওয়া হলো।`;
      } else if (mode === 'auto') {
        if (Array.isArray(prod.stockItems) && prod.stockItems.length >= qty) {
          const deliveredLines = prod.stockItems.splice(0, qty);
          if (prod.sheetUrl || (cat && cat.sheetUrl)) {
            prod.sheetDeliveredCount = (Number(prod.sheetDeliveredCount) || 0) + qty;
          }
          status = 'completed';
          deliveredData = deliveredLines.join('\n');
        } else {
          status = 'pending';
        }
      } else {
        status = 'pending';
      }

      const newOrder = {
        id: generateId('ORD'),
        userId: currentUser.id,
        userName: currentUser.name,
        productId: prod.id,
        productName: prod.name,
        categoryId: prod.categoryId,
        categoryName: cat ? cat.name : 'সাধারণ',
        deliveryMode: mode,
        preferredFormat: preferredFormat,
        qty: qty,
        unitPrice: prod.price,
        totalPrice: total,
        status: status,
        deliveredData: deliveredData,
        deliveredSheetUrl: deliveredSheetUrl,
        deliveredDirectLink: deliveredDirectLink,
        deliveredFileUrl: deliveredFileUrl,
        deliveredFileName: deliveredFileName,
        createdAt: getNowTime(),
        createdAtTs: Date.now()
      };

      state.orders.unshift(newOrder);
      cloudSaveDoc('users', currentUser.id, currentUser);
      cloudSaveDoc('products', prod.id, prod);
      cloudSaveDoc('orders', newOrder.id, newOrder);
      closeModal();
      showToast(
        status === 'completed'
          ? (deliveredSheetUrl && deliveredData ? 'অর্ডার সফল! সিরিয়াল অনুযায়ী টেক্সট ও গুগল শিট ডেলিভারি হয়েছে।'
            : deliveredSheetUrl ? 'অর্ডার সফল! গুগল শিট ফাইল ইনস্ট্যান্ট ডেলিভারি হয়েছে।'
            : deliveredFileUrl ? 'অর্ডার সফল! ফাইল ইনস্ট্যান্ট ডেলিভারি হয়েছে।'
            : deliveredDirectLink ? 'অর্ডার সফল! অ্যাক্সেস লিংক ইনস্ট্যান্ট ডেলিভারি হয়েছে।'
            : 'অর্ডার সফল! আপনার প্রোডাক্ট অটো ডেলিভারি হয়েছে।')
          : 'অর্ডার সফল হয়েছে! এডমিন শীঘ্রই ম্যানুয়ালি ডেলিভারি করবেন।',
        'success'
      );
      switchMainTab('orders');
    }

    function selectPaymentMethod(id) {

    function setQuickDepositAmount(amount) {
      state.depositInputBdt = String(amount);
      renderApp();
    }

    function handleDepositAmountInput(val) {
      state.depositInputBdt = val;
      const bdt = parseFloat(val) || 0;
      const usdEl = document.getElementById('binance-usd-output');
      const formulaRow = document.getElementById('binance-formula-row');
      const formulaText = document.getElementById('binance-formula-text');
      if (usdEl) {
        const usd = state.settings.binanceRate > 0 ? (bdt / state.settings.binanceRate) : 0;
        usdEl.textContent = '$' + usd.toFixed(2);
        if (formulaRow && formulaText) {
          if (bdt > 0) {
            formulaRow.classList.remove('hidden');
            formulaText.innerHTML = `${formatBDT(bdt)} ÷ ${state.settings.binanceRate}৳ = <strong>${usd.toFixed(2)} USDT</strong>`;
          } else {
            formulaRow.classList.add('hidden');
          }
        }
      }
    }

    function copyCurrentBinanceUsd() {
      const bdt = parseFloat(state.depositInputBdt) || 0;
      const usd = state.settings.binanceRate > 0 ? (bdt / state.settings.binanceRate) : 0;
      copyText(usd.toFixed(2), 'ডলার এমাউন্ট কপি হয়েছে!');

    function submitDeposit(e) {
      e.preventDefault();
      const currentUser = getCurrentUser();
      if (currentUser.blocked) {
        showToast('আপনার অ্যাকাউন্ট ব্লক করা হয়েছে! ডিপোজিট করা সম্ভব নয়।', 'error');
        return;
      }
      const amount = parseFloat(document.getElementById('deposit-amount-bdt').value);
      const txId = document.getElementById('deposit-txid').value.trim();
      const method = state.paymentMethods.find(m => m.id === state.selectedPaymentId && m.active);

      if (!method) {
        showToast('অনুগ্রহ করে সচল পেমেন্ট মাধ্যম নির্বাচন করুন।', 'error');
        return;
      }
      if (isNaN(amount) || amount < state.settings.minDeposit) {
        showToast(`সর্বনিম্ন ডিপোজিট ${formatBDT(state.settings.minDeposit)} হতে হবে!`, 'error');
        return;
      }
      if (!txId) {
        showToast('অনুগ্রহ করে ট্রানজেকশন আইডি (TrxID) সঠিকভাবে দিন।', 'error');
        return;
      }

      const usdAmount = method.isBinance && state.settings.binanceRate > 0
        ? (amount / state.settings.binanceRate).toFixed(2)
        : null;
      const newDeposit = {
        id: generateId('DEP'),
        userId: currentUser.id,
        userName: currentUser.name,
        methodId: method.id,
        methodName: method.name,
        amountBdt: amount,
        usdAmount: usdAmount,
        txId: txId.toUpperCase(),
        status: 'pending',
        createdAt: getNowTime(),
        createdAtTs: Date.now()
      };
      state.deposits.unshift(newDeposit);
      cloudSaveDoc('deposits', newDeposit.id, newDeposit);

      state.depositInputBdt = '';
      showToast('ডিপোজিট রিকোয়েস্ট জমা হয়েছে! এডমিন অ্যাপ্রুভ করলেই ব্যালেন্সে যোগ হবে।', 'success');
      renderApp();
    }

    // Live Google Sheet Column A Serial Sync inside Product Modal
    async function syncProductModalFromSheet() {
      const typedUrl = document.getElementById('prod-sheet-url')?.value.trim();
      const catId = document.getElementById('prod-cat')?.value;
      const cat = state.categories.find(c => c.id === catId);
      const effectiveUrl = typedUrl || (cat ? cat.sheetUrl : '');
      const skipHeader = document.getElementById('prod-sheet-skip-header')?.checked || false;
      const deliveredOffset = Math.max(0, parseInt(document.getElementById('prod-sheet-delivered')?.value || '0', 10) || 0);
      const statusEl = document.getElementById('prod-sheet-status');

      if (!effectiveUrl) {
        showToast('প্রথমে প্রোডাক্ট বা ক্যাটাগরিতে গুগল শিট লিংক দিন।', 'warning');
        return;
      }
      if (statusEl) {
        statusEl.textContent = '⏳ গুগল শিটের A কলাম থেকে সিরিয়াল ডেটা আনা হচ্ছে...';
        statusEl.className = 'text-[11px] font-semibold text-amber-700 mt-1.5';
      }

      const res = await fetchGoogleSheetColumnA(effectiveUrl, skipHeader);
      if (!res.ok) {
        if (statusEl) {
          statusEl.textContent = '✕ ' + res.error;
          statusEl.className = 'text-[11px] font-semibold text-rose-600 mt-1.5';
        }
        showToast(res.error, 'error');
        return;
      }

      const remainingItems = res.items.slice(deliveredOffset);
      const stockInput = document.getElementById('prod-stock');
      const itemsArea = document.getElementById('prod-items');
      if (stockInput) stockInput.value = remainingItems.length;
      if (itemsArea) itemsArea.value = remainingItems.join('\n');

      const colInfo = formatColumnLabels(res.maxCols);
      if (statusEl) {
        statusEl.textContent = `✓ A কলামের সিরিয়াল অনুযায়ী মোট ${res.totalCount} পিস (কলাম ${colInfo} একসাথে লোড • ${deliveredOffset} ডেলিভারড বাদে বাকি ${remainingItems.length} পিস)!`;
        statusEl.className = 'text-[11px] font-bold text-emerald-700 mt-1.5';
      }
      showToast(`কলাম A অনুযায়ী ${remainingItems.length} পিস (কলাম ${colInfo} সহ) স্টকে লোড হয়েছে!`, 'success');
    }
      showToast(`গুগল শিটের A কলাম থেকে ${remainingItems.length} পিস স্টক লোড হয়েছে!`, 'success');
    }

    function saveProduct(e, existingId) {
      e.preventDefault();
      const categoryId = document.getElementById('prod-cat').value;
      const name = document.getElementById('prod-name').value.trim();
      const price = parseFloat(document.getElementById('prod-price').value) || 0;
      const stock = parseInt(document.getElementById('prod-stock').value, 10) || 0;
      const deliveryMode = document.getElementById('prod-delivery-mode').value || 'inherit';
      const sheetUrl = document.getElementById('prod-sheet-url').value.trim();
      const sheetSkipHeader = document.getElementById('prod-sheet-skip-header')?.checked || false;
      const sheetDeliveredCount = Math.max(0, parseInt(document.getElementById('prod-sheet-delivered')?.value || '0', 10) || 0);
      const directLink = document.getElementById('prod-direct-link').value.trim();
      const fileUrl = tempUploads.prodFileUrl || '';
      const fileName = tempUploads.prodFileName || '';
      const description = document.getElementById('prod-desc').value.trim() || 'মানসম্মত ডিজিটাল প্রোডাক্ট।';
      // Normalize lines pasted directly from Google Sheets (Tab-separated Col A/B/C -> clean " | " format)
      const rawItems = document.getElementById('prod-items').value
        .split('\n')
        .map(line => line.trim())
        .filter(Boolean)
        .map(line => line.includes('\t') ? formatRowCellsToLine(line.split('\t')) : line);

      if (existingId) {
        const prod = state.products.find(p => p.id === existingId);
        if (prod) {
          prod.categoryId = categoryId;
          prod.name = name;
          prod.price = price;
          prod.stock = stock;
          prod.deliveryMode = deliveryMode;
          prod.sheetUrl = sheetUrl;
          prod.sheetSkipHeader = sheetSkipHeader;
          prod.sheetDeliveredCount = sheetDeliveredCount;
          prod.sheetTotalCount = rawItems.length + sheetDeliveredCount;
          prod.directLink = directLink;
          prod.fileUrl = fileUrl;
          prod.fileName = fileName;
          prod.description = description;
          prod.stockItems = rawItems;
          cloudSaveDoc('products', prod.id, prod);
        }
        showToast('প্রোডাক্ট ও স্টক আপডেট হয়েছে!', 'success');
      } else {
        const newProd = {
          id: generateId('PRD'),
          categoryId,
          name,
          price,
          stock,
          deliveryMode,
          sheetUrl,
          sheetSkipHeader,
          sheetDeliveredCount,
          sheetTotalCount: rawItems.length + sheetDeliveredCount,
          sheetLastSynced: rawItems.length > 0 && sheetUrl ? getNowTime() : '',
          directLink,
          fileUrl,
          fileName,
          description,
          stockItems: rawItems
        };
        state.products.unshift(newProd);
        cloudSaveDoc('products', newProd.id, newProd);
        showToast('নতুন প্রোডাক্ট যোগ করা হয়েছে!', 'success');
      }
      closeModal();
      renderApp();
    }

    function deleteProduct(prodId) {
      state.products = state.products.filter(p => p.id !== prodId);
      cloudDeleteDoc('products', prodId);
      showToast('প্রোডাক্ট মুছে ফেলা হয়েছে।', 'info');
      renderApp();
    }

      return `

            const badgeCls = dep.status === 'approved'
              ? 'bg-emerald-50 text-emerald-700 border-emerald-200'
              : dep.status === 'rejected'
                ? 'bg-rose-50 text-rose-700 border-rose-200'

            return `
              <div class="bg-white rounded-3xl border border-slate-200/90 p-4 shadow-sm space-y-3">

                    <p class="text-xs font-mono text-slate-700 mt-1">TrxID: <strong>${escapeHtml(dep.txId)}</strong></p>
                    <p class="text-[11px] text-slate-400 mt-0.5">${escapeHtml(dep.createdAt)}</p>
                  </div>
                  <div class="text-right shrink-0">
                    <span class="font-extrabold text-base text-slate-900 block">${formatBDT(dep.amountBdt)}</span>
                    ${dep.usdAmount ? `<span class="text-xs font-bold text-amber-600 font-mono">$${escapeHtml(dep.usdAmount)} USDT</span>` : ''}

                </div>

                ${isPending ? `
                  <div class="grid grid-cols-2 gap-2 pt-1">
                    <button onclick="approveDeposit('${dep.id}')" class="py-2.5 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow-sm transition">

                    </button>
                    <button onclick="rejectDeposit('${dep.id}')" class="py-2.5 rounded-2xl bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 text-xs font-bold transition">

    function approveDeposit(depId) {
      const dep = state.deposits.find(d => d.id === depId);
      if (!dep || dep.status !== 'pending') return;
      dep.status = 'approved';
      const user = state.users.find(u => u.id === dep.userId);
      if (user) {
        user.balance = (Number(user.balance) || 0) + (Number(dep.amountBdt) || 0);
        cloudSaveDoc('users', user.id, user);
      }
      cloudSaveDoc('deposits', dep.id, dep);
      showToast(`${formatBDT(dep.amountBdt)} অ্যাপ্রুভ হয়ে ইউজারের ব্যালেন্সে যোগ হয়েছে!`, 'success');
      renderApp();
    }

    function rejectDeposit(depId) {
      const dep = state.deposits.find(d => d.id === depId);
      if (!dep || dep.status !== 'pending') return;
      dep.status = 'rejected';
      cloudSaveDoc('deposits', dep.id, dep);
      showToast('ডিপোজিট রিকোয়েস্ট বাতিল করা হয়েছে।', 'warning');
      renderApp();
    }

    // Helper: Aggregate Deposits & Orders Statistics for a User
    function getUserStats(userId) {
      const userDeposits = state.deposits.filter(d => d.userId === userId);
      const userOrders = state.orders.filter(o => o.userId === userId);
      const totalDeposited = userDeposits
        .filter(d => d.status === 'approved')
        .reduce((sum, d) => sum + (Number(d.amountBdt) || 0), 0);
      const totalSpent = userOrders.reduce((sum, o) => sum + (Number(o.totalPrice) || 0), 0);
      const totalItemsBought = userOrders.reduce((sum, o) => sum + (Number(o.qty) || 0), 0);
      return {
        userDeposits,
        userOrders,
        totalDeposited,
        ordersCount: userOrders.length,
        totalItemsBought,
        totalSpent
      };
    }

    // Pull exact serial rows from product's Google Sheet / Stock queue into Manual Delivery Modal
    function fillManualDeliveryFromQueue(orderId) {
      const order = state.orders.find(o => o.id === orderId);
      if (!order) return;
      const prod = state.products.find(p => p.id === order.productId);
      if (!prod || !Array.isArray(prod.stockItems) || prod.stockItems.length === 0) {
        showToast('এই প্রোডাক্টের সিরিয়াল লিস্টে কোনো আইটেম নেই। আগে গুগল শিট সিঙ্ক বা লিস্ট যোগ করুন।', 'warning');
        return;
      }
      const takeCount = Math.min(order.qty, prod.stockItems.length);
      const previewItems = prod.stockItems.slice(0, takeCount);
      const textarea = document.getElementById('deliver-data-input');
      if (textarea) {
        textarea.value = previewItems.join('\n');
        textarea.dataset.usedQueueCount = String(takeCount);
      }
      showToast(`সিরিয়াল লিস্ট থেকে ${takeCount} পিস লোড হয়েছে! সেভ করলে কিউ থেকে বাদ যাবে।`, 'success');
    }

    function saveOrderDelivery(e, orderId) {
      e.preventDefault();
      const order = state.orders.find(o => o.id === orderId);
      if (!order) return;
      const sheetUrl = document.getElementById('deliver-sheet-input').value.trim();
      const directLink = document.getElementById('deliver-link-input').value.trim();
      const fileUrl = tempUploads.orderFileUrl || '';
      const fileName = tempUploads.orderFileName || '';
      const textarea = document.getElementById('deliver-data-input');
      const textData = textarea.value.trim();
      const usedQueueCount = parseInt(textarea.dataset.usedQueueCount || '0', 10) || 0;

      if (!sheetUrl && !directLink && !fileUrl && !textData) {
        showToast('অনুগ্রহ করে গুগল শিট, লিংক, ফাইল অথবা অ্যাকাউন্ট তথ্য দিন।', 'warning');
        return;
      }

      // If Admin loaded items from the serial queue, consume them from the queue & advance delivered serial count
      if (usedQueueCount > 0) {
        const prod = state.products.find(p => p.id === order.productId);
        if (prod && Array.isArray(prod.stockItems)) {
          prod.stockItems.splice(0, usedQueueCount);
          prod.sheetDeliveredCount = (Number(prod.sheetDeliveredCount) || 0) + usedQueueCount;
          cloudSaveDoc('products', prod.id, prod);
        }
      }

      order.deliveredSheetUrl = sheetUrl;
      order.deliveredDirectLink = directLink;
      order.deliveredFileUrl = fileUrl;
      order.deliveredFileName = fileName;
      order.deliveredData = textData;
      order.status = 'completed';
      cloudSaveDoc('orders', order.id, order);
      closeModal();
      showToast('অর্ডার সফলভাবে ডেলিভারি করা হয়েছে!', 'success');
      renderApp();
    }

      if (!user) return;
      const type = document.getElementById('bal-action-type').value;
      const amount = parseFloat(document.getElementById('bal-amount-input').value);
      const note = document.getElementById('bal-note-input').value.trim() || 'এডমিন অ্যাডজাস্টমেন্ট';

      if (isNaN(amount) || amount < 0) {
        showToast('সঠিক টাকার পরিমাণ দিন।', 'error');
        return;
      }

      if (type === 'add') {
        user.balance += amount;
      } else if (type === 'deduct') {
        user.balance = Math.max(0, user.balance - amount);
      } else {
        user.balance = amount;
      }
      const newLog = {
        id: generateId('LOG'),
        userId: user.id,
        type,
        amount,
        note,
        createdAt: getNowTime(),
        createdAtTs: Date.now()
      };
      state.balanceLogs.unshift(newLog);
      cloudSaveDoc('users', user.id, user);
      cloudSaveDoc('balance_logs', newLog.id, newLog);

      closeModal();
      showToast(`"${user.name}" এর নতুন ব্যালেন্স ${formatBDT(user.balance)} করা হয়েছে!`, 'success');
      renderApp();
    }

    function savePaymentMethod(e, existingId) {
      e.preventDefault();
      const name = document.getElementById('pm-name').value.trim();
      const number = document.getElementById('pm-number').value.trim();
      const type = document.getElementById('pm-type').value.trim();
      const typedLogoUrl = document.getElementById('pm-logo-url').value.trim();
      // Prioritize newly uploaded gallery photo over typed URL
      const logoUrl = (tempUploads.pmLogoUrl && tempUploads.pmLogoUrl.startsWith('blob:'))
        ? tempUploads.pmLogoUrl
        : (typedLogoUrl || tempUploads.pmLogoUrl || '');
      const isBinance = document.getElementById('pm-is-binance').checked;

      if (existingId) {
        const m = state.paymentMethods.find(x => x.id === existingId);
        if (m) {
          m.name = name;
          m.number = number;
          m.type = type;
          m.logoUrl = logoUrl;
          m.isBinance = isBinance;
        }
        cloudSaveConfig();
        showToast('পেমেন্ট মাধ্যম ও লোগো আপডেট করা হয়েছে!', 'success');
      } else {
        state.paymentMethods.push({
          id: generateId('PM'),
          name,
          number,
          type,
          color: '#4F46E5',
          logoKey: isBinance ? 'binance' : 'custom',
          logoUrl,
          isBinance,
          active: true
        });
        cloudSaveConfig();
        showToast('নতুন পেমেন্ট মাধ্যম যুক্ত হয়েছে!', 'success');
      }
      closeModal();
      renderApp();
    }

    function deletePaymentMethod(id) {
      state.paymentMethods = state.paymentMethods.filter(m => m.id !== id);
      cloudSaveConfig();
      closeModal();
      showToast('পেমেন্ট মাধ্যম মুছে ফেলা হয়েছে।', 'info');
      renderApp();
    }

    /**
     * ===================================================================
     * 9. MAIN RENDER LOOP & INITIALIZATION
     * ===================================================================
     */
    function renderApp() {
      try {
        updateHeaderAndNav();
        const main = document.getElementById('main-content');
        if (state.activeTab === 'shop') {
          main.innerHTML = renderShopView();
        } else if (state.activeTab === 'deposit') {
          main.innerHTML = renderDepositView();
        } else if (state.activeTab === 'orders') {
          main.innerHTML = renderOrdersView();
        } else if (state.activeTab === 'admin') {
          main.innerHTML = renderAdminView();
        }
      } catch (error) {
        console.error('Render Error:', error);
        showToast('অ্যাপ লোড করতে সমস্যা হয়েছে।', 'error');
      }
    }

    // Boot App on Load
    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
  </script>

  <!-- =====================================================================
       LIVE REAL-TIME CLOUD DATABASE SYNC ENGINE (MULTI-USER & MULTI-DEVICE)
       ===================================================================== -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    /**
     * নিজে আলাদাভাবে Netlify Drop / GitHub Pages-এ হোস্ট করতে চাইলে
     * আপনার ফ্রি Firebase প্রজেক্টের Web App Config নিচের null-এর বদলে বসিয়ে দিন।
     */
    const CUSTOM_FIREBASE_CONFIG = null;

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'digital-store-bd';
    const firebaseConfig = typeof __firebase_config !== 'undefined'
      ? JSON.parse(__firebase_config)
      : CUSTOM_FIREBASE_CONFIG;

    let db = null;
    let auth = null;
    let currentAuthUser = null;

    // Public shared collection helper (Strict Rule 1 Path)
    const publicCol = (name) => collection(db, 'artifacts', appId, 'public', 'data', name);
    const publicDoc = (name, id) => doc(db, 'artifacts', appId, 'public', 'data', name, id);

    // Expose Write Operations guarded by authenticated user (Rule 3)
    window.cloudDb = {
      async saveConfig(settings, paymentMethods) {
        if (!currentAuthUser || !db) return;
        try {
          await setDoc(publicDoc('store_config', 'main'), {
            settings,
            paymentMethods,
            seeded: true,
            updatedAt: Date.now()
          });
        } catch (err) {
          console.error('Config Save Error:', err);
        }
      },
      async saveDoc(collectionName, docId, data) {
        if (!currentAuthUser || !db || !docId) return;
        try {
          await setDoc(publicDoc(collectionName, String(docId)), { ...data });
        } catch (err) {
          console.error(`Save Error (${collectionName}/${docId}):`, err);
        }
      },
      async deleteDoc(collectionName, docId) {
        if (!currentAuthUser || !db || !docId) return;
        try {
          await deleteDoc(publicDoc(collectionName, String(docId)));
        } catch (err) {
          console.error(`Delete Error (${collectionName}/${docId}):`, err);
        }
      }
    };

    // Seed starter categories, products, settings & demo items once on brand-new database
    async function seedInitialDataIfEmpty() {
      if (!currentAuthUser || !db) return;
      const cfgRef = publicDoc('store_config', 'main');
      const snap = await getDoc(cfgRef);
      if (snap.exists()) return;

      const initial = window.__storeBridge.getInitialSnapshot();
      await setDoc(cfgRef, {
        settings: initial.settings,
        paymentMethods: initial.paymentMethods,
        seeded: true,
        updatedAt: Date.now()
      });

      const writes = [];
      initial.categories.forEach(c => writes.push(setDoc(publicDoc('categories', c.id), c)));
      initial.products.forEach(p => writes.push(setDoc(publicDoc('products', p.id), p)));
      initial.users.forEach(u => writes.push(setDoc(publicDoc('users', u.id), u)));
      initial.deposits.forEach(d => writes.push(setDoc(publicDoc('deposits', d.id), d)));
      initial.orders.forEach(o => writes.push(setDoc(publicDoc('orders', o.id), o)));
      await Promise.all(writes);
    }

    // Attach Real-Time Listeners (Simple collection queries only, sorted in JS memory - Rule 2)
    function attachRealtimeListeners() {
      if (!currentAuthUser || !db) return;

      onSnapshot(
        publicDoc('store_config', 'main'),
        (snap) => {
          if (snap.exists()) {
            window.__storeBridge.applyRemoteConfig(snap.data());
          }
        },
        (err) => console.error('Config listener error:', err)
      );

      const collectionsMap = [
        { col: 'categories', stateKey: 'categories' },
        { col: 'products', stateKey: 'products' },
        { col: 'users', stateKey: 'users' },
        { col: 'deposits', stateKey: 'deposits' },
        { col: 'orders', stateKey: 'orders' },
        { col: 'balance_logs', stateKey: 'balanceLogs' }
      ];

      collectionsMap.forEach(({ col, stateKey }) => {
        onSnapshot(
          publicCol(col),
          (snapshot) => {
            const list = [];
            snapshot.forEach((docSnap) => list.push(docSnap.data()));
            window.__storeBridge.applyRemoteCollection(stateKey, list);
          },
          (err) => console.error(`${col} listener error:`, err)
        );
      });
    }

    // Initialize Auth FIRST, then connect Real-Time Cloud Sync (Rule 3)
    async function bootCloudSync() {
      if (!firebaseConfig) {
        window.__storeBridge.setCloudStatus('offline');
        return;
      }
      try {
        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);

        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          const cred = await signInWithCustomToken(auth, __initial_auth_token);
          currentAuthUser = cred.user;
        } else {
          const cred = await signInAnonymously(auth);
          currentAuthUser = cred.user;
        }

        if (!currentAuthUser) return;
        await seedInitialDataIfEmpty();
        window.__storeBridge.setCloudStatus('online', currentAuthUser.uid);
        window.__storeBridge.ensureAuthUserProfile(currentAuthUser.uid);
        attachRealtimeListeners();
      } catch (err) {
        console.error('Cloud Initialization Error:', err);
        window.__storeBridge.setCloudStatus('error');
      }
    }

    bootCloudSync();
  </script>
</body>
