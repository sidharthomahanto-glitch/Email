<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>টেম্প মেইল ম্যানেজার</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05); 
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2); 
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3); 
        }
        
        /* Toast Animation */
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }
        .toast-enter {
            animation: slideIn 0.3s forwards;
        }
        .toast-exit {
            animation: slideOut 0.3s forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-8 px-4 sm:px-6">

    <!-- Header Section -->
    <div class="w-full max-w-3xl mb-6 text-center">
        <h1 class="text-3xl font-bold text-white mb-2">টেম্প মেইল ম্যানেজার</h1>
        <p class="text-slate-400 text-sm">খুব সহজেই আপনার টেম্প মেইলগুলো সেভ করে রাখুন</p>
    </div>

    <!-- Input Form Section -->
    <div class="w-full max-w-3xl bg-slate-800 rounded-xl p-4 mb-8 shadow-sm border border-slate-700/50">
        <form id="add-mail-form" class="flex flex-col sm:flex-row gap-3">
            <input type="text" id="mailName" required placeholder="মেইলের নাম (যেমন: Netflix)" 
                class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-colors">
            
            <input type="url" id="mailUrl" required placeholder="লিংক (https://...)" 
                class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-colors">
            
            <button type="submit" 
                class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-6 rounded-lg transition-colors whitespace-nowrap flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                </svg>
                যুক্ত করুন
            </button>
        </form>
    </div>

    <!-- Mails List Section -->
    <div class="w-full max-w-3xl">
        <div class="flex justify-between items-center mb-3 px-1">
            <h2 class="text-lg font-medium text-slate-300">আপনার মেইলসমূহ</h2>
            <span id="mail-count" class="text-slate-400 text-sm">মোট: 0</span>
        </div>
        
        <!-- List Container -->
        <div id="mails-container" class="flex flex-col gap-3">
            <!-- Mail Items will be injected here via JavaScript -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden flex-col items-center justify-center py-12 text-center bg-slate-800/50 rounded-xl border border-slate-700/50 border-dashed">
            <p class="text-slate-400">এখনো কোনো মেইল যুক্ত করা হয়নি!</p>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 flex flex-col gap-2 z-50"></div>

    <script>
        // State Management (In-Memory array)
        let tempMails = [
            { id: Date.now(), name: "উদাহরণ টেম্প মেইল ১", url: "https://temp-mail.org" }
        ];

        // DOM Elements
        const form = document.getElementById('add-mail-form');
        const container = document.getElementById('mails-container');
        const emptyState = document.getElementById('empty-state');
        const mailCount = document.getElementById('mail-count');
        const toastContainer = document.getElementById('toast-container');

        // Initial Render
        renderMails();

        // Form Submit Handler
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nameInput = document.getElementById('mailName').value.trim();
            const urlInput = document.getElementById('mailUrl').value.trim();

            if (nameInput && urlInput) {
                const newMail = {
                    id: Date.now(),
                    name: nameInput,
                    url: urlInput
                };

                tempMails.unshift(newMail); // Add to beginning
                renderMails();
                form.reset();
                showToast('নতুন লিংক যুক্ত করা হয়েছে!', 'success');
                
                // নতুন মেইল এড করার সাথে সাথেই তা নতুন ট্যাবে ওপেন করার কোড
                window.open(urlInput, '_blank');
            }
        });

        // Render Mails Function
        function renderMails() {
            container.innerHTML = '';
            mailCount.textContent = `মোট: ${tempMails.length}`;

            if (tempMails.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');

                tempMails.forEach(mail => {
                    const card = document.createElement('div');
                    card.className = 'bg-slate-800 rounded-lg p-3 md:p-4 flex items-center justify-between gap-3 md:gap-4 hover:bg-slate-700 transition-colors border border-slate-700/50 group';
                    
                    card.innerHTML = `
                        <!-- Left: Clickable Info -->
                        <a href="${escapeHTML(mail.url)}" target="_blank" rel="noopener noreferrer" class="flex items-center gap-3 md:gap-4 flex-1 min-w-0 cursor-pointer text-left" title="নতুন ট্যাবে ওপেন করুন">
                            <div class="bg-blue-500/10 text-blue-400 p-2 md:p-3 rounded-full group-hover:bg-blue-500/20 group-hover:text-blue-300 transition-colors flex-shrink-0">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 md:h-6 md:w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                                </svg>
                            </div>
                            <div class="flex-1 min-w-0">
                                <h3 class="text-slate-200 font-medium text-base md:text-lg truncate group-hover:text-white transition-colors">${escapeHTML(mail.name)}</h3>
                                <p class="text-slate-400 text-xs md:text-sm truncate mt-0.5">${escapeHTML(mail.url)}</p>
                            </div>
                        </a>
                        
                        <!-- Right: Action Buttons -->
                        <div class="flex items-center gap-1 md:gap-2 flex-shrink-0">
                            <button onclick="copyToClipboard('${mail.url.replace(/'/g, "\\'")}')" 
                                class="p-2 md:p-2.5 text-slate-400 hover:text-white hover:bg-slate-600 rounded-lg transition-colors" title="লিংক কপি করুন">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 md:h-5 md:w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                                </svg>
                            </button>
                            <button onclick="deleteMail(${mail.id})" 
                                class="p-2 md:p-2.5 text-slate-400 hover:text-red-400 hover:bg-slate-600 rounded-lg transition-colors" title="মুছে ফেলুন">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 md:h-5 md:w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                </svg>
                            </button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }
        }

        // Delete Function
        function deleteMail(id) {
            tempMails = tempMails.filter(mail => mail.id !== id);
            renderMails();
            showToast('লিংক মুছে ফেলা হয়েছে!', 'error');
        }

        // Copy Function (Using execCommand for iFrame compatibility)
        function copyToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showToast('লিংক কপি করা হয়েছে!', 'success');
                } else {
                    showToast('কপি করতে ব্যর্থ হয়েছে।', 'error');
                }
            } catch (err) {
                showToast('কপি করতে ব্যর্থ হয়েছে।', 'error');
            }
            
            document.body.removeChild(textArea);
        }

        // Toast Notification System
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-emerald-500' : 'bg-red-500';
            
            toast.className = `${bgColor} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 toast-enter max-w-sm`;
            
            const icon = type === 'success' 
                ? `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" /></svg>`
                : `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" /></svg>`;
            
            toast.innerHTML = `
                ${icon}
                <span class="font-medium">${message}</span>
            `;
            
            toastContainer.appendChild(toast);
            
            // Remove toast after 3 seconds
            setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-exit');
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }, 3000);
        }

        // Utility: Prevent XSS
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }
    </script>
</body>
</html>
